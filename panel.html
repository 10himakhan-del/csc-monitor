<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DJShield — Panel</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0a0f1e;--surface:#111827;--surface2:#1a2234;
  --border:rgba(99,102,241,.2);--accent:#6366f1;--accent2:#8b5cf6;
  --green:#10b981;--red:#ef4444;--amber:#f59e0b;
  --text:#e2e8f0;--muted:#64748b;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;padding:16px;
  background-image:radial-gradient(ellipse at top,rgba(245,158,11,.06) 0%,transparent 60%);}
.card{background:var(--surface);border-radius:16px;padding:16px;margin-bottom:12px;
  border:1px solid var(--border);box-shadow:0 4px 24px rgba(0,0,0,.4);}
.fg{margin-bottom:12px;}
.fg label{display:block;font-size:10px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;}
.fg input{width:100%;background:var(--surface2);border:1.5px solid var(--border);
  border-radius:10px;padding:11px 13px;font-size:14px;font-family:inherit;
  outline:none;color:var(--text);}
.fg input:focus{border-color:var(--accent);}
.fg input::placeholder{color:var(--muted);}
.btn{border:none;border-radius:10px;padding:11px 16px;font-weight:800;
  font-size:13px;cursor:pointer;font-family:inherit;}
.btn-green{background:linear-gradient(135deg,#10b981,#059669);color:#fff;}
.btn-accent{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;}
.btn-outline{background:rgba(99,102,241,.08);color:var(--accent);border:1.5px solid rgba(99,102,241,.3);}
.btn-red{background:rgba(239,68,68,.1);color:var(--red);border:1.5px solid rgba(239,68,68,.3);}
.btn-amber{background:rgba(245,158,11,.1);color:var(--amber);border:1.5px solid rgba(245,158,11,.3);}
.btn-gray{background:var(--surface2);color:var(--muted);border:1px solid var(--border);}
.plan-pill{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;display:inline-block;}
.badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}
.badge-ok{background:rgba(16,185,129,.15);color:#10b981;}
.badge-warn{background:rgba(245,158,11,.15);color:#f59e0b;}
.badge-exp{background:rgba(239,68,68,.15);color:#ef4444;}
.badge-none{background:rgba(100,116,139,.15);color:#64748b;}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);
  z-index:100;align-items:flex-end;justify-content:center;padding:16px;backdrop-filter:blur(4px);}
.overlay.show{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:20px 20px 0 0;
  width:100%;max-width:420px;max-height:90vh;overflow-y:auto;box-shadow:0 -8px 40px rgba(0,0,0,.6);}
.tabs{display:flex;gap:8px;margin-bottom:12px;}
.tab{background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;
  padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--muted);}
.tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px;}
.stat-box{background:var(--surface);border-radius:14px;padding:14px 10px;text-align:center;border:1px solid var(--border);}
.stat-num{font-size:26px;font-weight:900;line-height:1;}
.stat-lbl{font-size:10px;color:var(--muted);margin-top:4px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
.plan-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;}
.plan-btn{border-radius:10px;padding:10px 6px;font-weight:800;font-size:12px;cursor:pointer;font-family:inherit;text-align:center;border:2px solid;}
.month-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;}
.month-btn{border-radius:10px;padding:10px;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit;text-align:center;border:2px solid var(--accent);}
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--surface);
  border:1px solid var(--accent);color:var(--text);padding:10px 20px;border-radius:12px;
  font-size:13px;font-weight:600;z-index:999;display:none;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.5);}
.alert-red{background:rgba(239,68,68,.1);border:1.5px solid rgba(239,68,68,.3);
  border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:13px;color:var(--red);font-weight:600;}
.client-card{background:var(--surface);border-radius:16px;padding:14px 16px;
  margin-bottom:12px;border:1px solid var(--border);box-shadow:0 4px 20px rgba(0,0,0,.3);}
.client-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:24px;
  padding:32px 24px;width:100%;max-width:340px;box-shadow:0 24px 64px rgba(0,0,0,.6);}
.shake{animation:shake .4s ease;}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-8px);}40%{transform:translateX(8px);}60%{transform:translateX(-4px);}80%{transform:translateX(4px);}}
.err-box{background:rgba(239,68,68,.1);border:1.5px solid rgba(239,68,68,.3);color:var(--red);
  padding:10px 12px;margin-top:12px;font-size:13px;font-weight:600;display:none;border-radius:10px;}
.dj-logo{text-align:center;margin-bottom:24px;}
.dj-logo-icon{width:64px;height:64px;margin:0 auto 12px;
  background:linear-gradient(135deg,#f59e0b,#d97706);
  border-radius:18px;display:flex;align-items:center;justify-content:center;
  font-size:28px;box-shadow:0 8px 24px rgba(245,158,11,.4);}
.dj-logo h1{font-size:22px;font-weight:900;
  background:linear-gradient(135deg,#fbbf24,#f59e0b);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.dj-logo p{font-size:11px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:1.5px;}
.login-input{width:100%;background:var(--surface2);border:1.5px solid var(--border);
  border-radius:12px;padding:14px 16px;font-size:15px;outline:none;font-family:inherit;
  color:var(--text);margin-bottom:4px;}
.login-input:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(245,158,11,.15);}
.login-input::placeholder{color:var(--muted);}
.login-btn{width:100%;background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;border:none;
  border-radius:12px;padding:15px;font-size:15px;font-weight:800;cursor:pointer;margin-top:12px;
  font-family:inherit;box-shadow:0 8px 24px rgba(245,158,11,.4);}
.dj-header{background:linear-gradient(135deg,rgba(245,158,11,.12),rgba(245,158,11,.06));
  border:1px solid rgba(245,158,11,.2);border-radius:16px;padding:14px 16px;
  margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 4px 24px rgba(0,0,0,.3);}
.pw-box{background:linear-gradient(135deg,rgba(16,185,129,.08),rgba(16,185,129,.04));
  border:1px solid rgba(16,185,129,.2);border-radius:10px;padding:10px 12px;margin-bottom:10px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;}
</style>
</head>
<body>
<div id="toast"></div>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="dj-logo">
      <div class="dj-logo-icon">🌟</div>
      <h1>DJShield</h1>
      <p>Partner Panel</p>
    </div>
    <div class="fg">
      <label>Your Password</label>
      <input class="login-input" id="login-pass" type="password"
        placeholder="Enter your password"
        onkeydown="if(event.key==='Enter')doLogin()"/>
    </div>
    <button class="login-btn" onclick="doLogin()">🔓 Login</button>
    <div class="err-box" id="login-err">❌ Invalid password or account blocked</div>
  </div>
</div>

<!-- MAIN -->
<div id="main-panel" style="display:none;">
<div class="dj-header">
  <div style="display:flex;align-items:center;gap:10px;">
    <div style="width:36px;height:36px;background:linear-gradient(135deg,#f59e0b,#d97706);
      border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;">🌟</div>
    <div>
      <div style="font-size:16px;font-weight:900;background:linear-gradient(135deg,#fbbf24,#f59e0b);
        -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">DJShield</div>
      <div style="font-size:11px;color:var(--muted);" id="sa-welcome">Partner Panel</div>
    </div>
  </div>
  <div style="display:flex;gap:8px;">
    <button class="btn btn-amber" onclick="openAddClient()"
      style="font-size:13px;padding:9px 14px;">+ Client</button>
    <button class="btn btn-gray" onclick="doLogout()"
      style="font-size:12px;padding:9px 12px;">Exit</button>
  </div>
</div>

<div class="stats">
  <div class="stat-box"><div class="stat-num" id="s-total" style="color:var(--amber);">0</div><div class="stat-lbl">Total</div></div>
  <div class="stat-box"><div class="stat-num" id="s-active" style="color:var(--green);">0</div><div class="stat-lbl">Active</div></div>
  <div class="stat-box"><div class="stat-num" id="s-due" style="color:var(--red);">0</div><div class="stat-lbl">Due/Exp</div></div>
</div>
<div class="alert-red" id="due-alert" style="display:none;">⚠️ <span id="due-msg"></span></div>
<div class="tabs">
  <button class="tab active" onclick="setTab('all',this)">All</button>
  <button class="tab" onclick="setTab('due',this)">Due/Exp</button>
  <button class="tab" onclick="setTab('active',this)">Active</button>
</div>
<div id="client-list"></div>
</div>

<!-- ADD CLIENT MODAL -->
<div class="overlay" id="modal-add">
  <div class="modal">
    <div style="padding:16px 18px;background:linear-gradient(135deg,#f59e0b,#d97706);border-radius:20px 20px 0 0;font-weight:800;font-size:15px;color:#fff;">➕ New Client</div>
    <div style="padding:16px;">
      <div class="fg"><label>Client Name *</label><input id="a-name" placeholder="e.g. Ramesh Sharma"/></div>
      <div class="fg"><label>Firebase URL *</label><input id="a-url" placeholder="https://xxx-default-rtdb.firebaseio.com" type="url"/></div>
      <div class="fg"><label>API Key</label><input id="a-key" placeholder="AIzaSy..." type="password"/></div>
      <div class="fg"><label>Project ID</label><input id="a-pid" placeholder="your-project-id"/></div>
      <div class="fg"><label>Main Node</label><input id="a-node" value="csc6"/></div>
      <div class="fg"><label>Plan</label>
        <div class="plan-grid">
          <button class="plan-btn" data-plan="basic" style="background:rgba(59,130,246,.15);color:#3b82f6;border-color:#3b82f6;" onclick="selectPlan(this)">Basic<br><span style="font-size:11px">₹5,000</span></button>
          <button class="plan-btn" data-plan="standard" style="background:rgba(139,92,246,.08);color:#8b5cf6;border-color:#8b5cf6;" onclick="selectPlan(this)">Standard<br><span style="font-size:11px">₹10,000</span></button>
          <button class="plan-btn" data-plan="premium" style="background:rgba(245,158,11,.08);color:#f59e0b;border-color:#f59e0b;" onclick="selectPlan(this)">Premium<br><span style="font-size:11px">₹15,000</span></button>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <button class="btn btn-gray" onclick="closeModal('modal-add')">Cancel</button>
        <button class="btn btn-green" onclick="saveClient()">Save Client</button>
      </div>
    </div>
  </div>
</div>

<!-- PAYMENT MODAL -->
<div class="overlay" id="modal-pay">
  <div class="modal">
    <div style="padding:16px 18px;background:linear-gradient(135deg,var(--green),#059669);border-radius:20px 20px 0 0;font-weight:800;font-size:15px;color:#fff;">💳 Record Payment</div>
    <div style="padding:16px;">
      <div style="font-size:13px;color:var(--muted);margin-bottom:14px;" id="pay-client-name"></div>
      <div style="background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.2);border-radius:12px;padding:12px;margin-bottom:14px;">
        <div style="font-size:11px;color:var(--muted);margin-bottom:4px;">Current Status</div>
        <span id="pay-status-badge"></span>
        <div style="font-size:12px;color:var(--muted);margin-top:6px;" id="pay-current-expiry"></div>
      </div>
      <div class="fg"><label>Months</label>
        <div class="month-grid">
          <button class="month-btn" data-months="1" onclick="selectMonths(this)" style="background:var(--accent);color:#fff;">1 Month<br><span class="month-price" style="font-size:11px"></span></button>
          <button class="month-btn" data-months="2" onclick="selectMonths(this)" style="background:transparent;color:var(--accent);">2 Months<br><span class="month-price" style="font-size:11px"></span></button>
          <button class="month-btn" data-months="3" onclick="selectMonths(this)" style="background:transparent;color:var(--accent);">3 Months<br><span class="month-price" style="font-size:11px"></span></button>
        </div>
      </div>
      <div style="background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px;">
        <span style="color:var(--amber);font-weight:700;">New expiry: </span>
        <span style="color:var(--amber);" id="pay-new-expiry"></span>
      </div>
      <div class="fg"><label>Note (optional)</label><input id="pay-note" placeholder="e.g. GPay, cash..."/></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <button class="btn btn-gray" onclick="closeModal('modal-pay')">Cancel</button>
        <button class="btn btn-green" onclick="confirmPayment()">✅ Confirm</button>
      </div>
    </div>
  </div>
</div>

<!-- CHANGE PASSWORD MODAL -->
<div class="overlay" id="modal-cpw">
  <div class="modal">
    <div style="padding:16px 18px;background:linear-gradient(135deg,var(--green),#059669);border-radius:20px 20px 0 0;font-weight:800;font-size:15px;color:#fff;">🔑 Change Firebase Password</div>
    <div style="padding:16px;">
      <div style="font-size:13px;color:var(--muted);margin-bottom:14px;" id="cpw-client-name"></div>
      <div style="background:rgba(16,185,129,.08);border:1.5px solid rgba(16,185,129,.2);border-radius:10px;padding:10px 14px;margin-bottom:14px;">
        <div style="font-size:11px;color:var(--muted);margin-bottom:4px;">Current Password</div>
        <div id="cpw-current" style="font-size:18px;font-weight:800;color:var(--green);letter-spacing:2px;font-family:monospace;">---</div>
      </div>
      <div class="fg"><label>New Password</label><input id="cpw-input" type="text" placeholder="Naya password daalo" onkeydown="if(event.key==='Enter')doChangePw()"/></div>
      <div style="background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:9px 12px;margin-bottom:12px;font-size:12px;color:var(--red);display:none;" id="cpw-err"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <button class="btn btn-gray" onclick="closeModal('modal-cpw')">Cancel</button>
        <button class="btn btn-green" id="cpw-btn" onclick="doChangePw()">💾 Save</button>
      </div>
    </div>
  </div>
</div>

<script>
/* DJShield Partner Panel */
var _S='csc$m0n!t0r#2025';
var _EU='CwcXVB4KQQ4VVB9KXB0BAQVBVgkJVQhAAVwGDkBEVldNFQpWCFIPUhFZHQ1RX18';
var _EK='IjoZRT5JL1EzUSRzVl9ocU4aPBFeQy9gAHE0ZnN_H39aCSZjQGpW';
function _d(e,k){var s=e.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';
  var b=atob(s),r='';for(var i=0;i<b.length;i++)r+=String.fromCharCode(b.charCodeAt(i)^k.charCodeAt(i%k.length));return r;}
var ADMIN_FB_URL=_d(_EU,_S);
var ADMIN_FB_KEY=_d(_EK,_S);
var ADMIN_AUTH='?auth='+encodeURIComponent(ADMIN_FB_KEY);

var BASE_URL='https://10himakhan-del.github.io/csc-monitor/';
var SESSION_KEY='djs_sa_auth';
var curSaId=null;
var clients=[];
var curTab='all',curPayClient=null,curPlan='basic',curMonths=1,curPwId=null;

async function sha256(str){
  var buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
}

/* Get sub admin ID from URL hash */
function getSaId(){
  try{
    var h=window.location.hash.slice(1);
    if(!h)return null;
    var dec=atob(h.replace(/-/g,'+').replace(/_/g,'/'));
    if(dec.startsWith('sa:'))return dec.slice(3);
  }catch(e){}
  return null;
}

async function doLogin(){
  var id=getSaId();
  if(!id){
    document.getElementById('login-err').textContent='❌ Invalid link';
    document.getElementById('login-err').style.display='block';
    return;
  }
  var pass=document.getElementById('login-pass').value;
  var hash=await sha256(pass);
  /* Verify against Firebase */
  fetch(ADMIN_FB_URL+'/djs_admins/'+id+'.json'+ADMIN_AUTH)
    .then(function(r){return r.json();})
    .then(function(data){
      if(!data){showErr('Account not found');return;}
      if(data.active===false){showErr('Account blocked. Contact admin.');return;}
      if(data.password_hash!==hash){showErr('Wrong password');return;}
      /* Success */
      curSaId=id;
      sessionStorage.setItem(SESSION_KEY,id);
      document.getElementById('login-screen').style.display='none';
      document.getElementById('main-panel').style.display='block';
      document.getElementById('sa-welcome').textContent='Welcome, '+data.name;
      loadClients();
    })
    .catch(function(){showErr('Connection failed');});
}
function showErr(msg){
  var box=document.getElementById('login-err');
  box.textContent='❌ '+msg;box.style.display='block';
  var card=box.closest('.login-card');
  card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');
  document.getElementById('login-pass').value='';
  document.getElementById('login-pass').focus();
}
function doLogout(){
  sessionStorage.removeItem(SESSION_KEY);curSaId=null;clients=[];
  document.getElementById('main-panel').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('login-pass').value='';
  document.getElementById('login-err').style.display='none';
}
window.addEventListener('load',function(){
  var id=getSaId();
  var saved=sessionStorage.getItem(SESSION_KEY);
  if(saved&&saved===id){
    curSaId=id;
    document.getElementById('login-screen').style.display='none';
    document.getElementById('main-panel').style.display='block';
    loadClients();
  }
});

/* Firebase load/save for sub admin */
function loadClients(){
  if(!curSaId)return;
  fetch(ADMIN_FB_URL+'/djs_admins/'+curSaId+'/clients.json'+ADMIN_AUTH)
    .then(function(r){return r.json();})
    .then(function(data){
      clients=data&&Array.isArray(data)?data:[];
      renderAll();
    }).catch(function(){clients=[];renderAll();});
}
function saveAll(){
  if(!curSaId)return;
  fetch(ADMIN_FB_URL+'/djs_admins/'+curSaId+'/clients.json'+ADMIN_AUTH,{
    method:'PUT',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(clients)
  }).catch(function(e){console.log('save err',e.message);});
}

/* Utils */
var PLANS={basic:{label:'Basic',price:5000,color:'#3b82f6'},standard:{label:'Standard',price:10000,color:'#8b5cf6'},premium:{label:'Premium',price:15000,color:'#f59e0b'}};
function daysLeft(e){if(!e)return null;return Math.ceil((new Date(e)-new Date())/86400000);}
function fmtDate(iso){if(!iso)return'—';return new Date(iso).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});}
function badgeHtml(e){var d=daysLeft(e);
  if(d===null)return'<span class="badge badge-none">No Plan</span>';
  if(d<0)return'<span class="badge badge-exp">❌ Expired</span>';
  if(d<=5)return'<span class="badge badge-warn">⚠️ '+d+'d left</span>';
  return'<span class="badge badge-ok">✅ Active · '+d+'d</span>';}
function planBadge(id){var p=PLANS[id]||PLANS.basic;
  return'<span class="plan-pill" style="background:'+p.color+'20;color:'+p.color+';">'+p.label+' · ₹'+p.price.toLocaleString('en-IN')+'/mo</span>';}
function encodeLink(c,isAdmin){
  var payload={u:c.fbUrl,k:c.apiKey||'',n:c.node||'csc6',p:c.pid||'',t:'',a:isAdmin?1:0};
  return btoa(unescape(encodeURIComponent(JSON.stringify(payload)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(window._tt);window._tt=setTimeout(function(){t.style.display='none';},3000);}
function openModal(id){document.getElementById(id).classList.add('show');}
function closeModal(id){document.getElementById(id).classList.remove('show');}
function setTab(tab,el){curTab=tab;document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});el.classList.add('active');renderList();}

/* Render */
function renderAll(){
  var total=clients.length;
  var active=clients.filter(function(c){var d=daysLeft(c.expiry);return d!==null&&d>5;}).length;
  var due=clients.filter(function(c){var d=daysLeft(c.expiry);return d===null||d<=5;}).length;
  document.getElementById('s-total').textContent=total;
  document.getElementById('s-active').textContent=active;
  document.getElementById('s-due').textContent=due;
  var al=document.getElementById('due-alert');
  if(due>0){al.style.display='block';document.getElementById('due-msg').textContent=due+' client ka payment due/expired!';}
  else al.style.display='none';
  renderList();
}
function renderList(){
  var filtered=clients.filter(function(c){
    if(curTab==='due'){var d=daysLeft(c.expiry);return d===null||d<=5;}
    if(curTab==='active'){var d=daysLeft(c.expiry);return d!==null&&d>5;}
    return true;
  });
  var list=document.getElementById('client-list');
  if(!filtered.length){list.innerHTML='<div style="text-align:center;color:var(--muted);padding:40px;font-size:14px;">'+(clients.length===0?'Koi client nahi — "+ Client" se add karo':'Is category mein koi client nahi')+'</div>';return;}
  var html='';
  filtered.forEach(function(c){
    var p=PLANS[c.plan]||PLANS.basic;var d=daysLeft(c.expiry);var expired=d!==null&&d<0;var nm=c.name.replace(/'/g,"\\'");
    html+='<div class="client-card" style="border-left:4px solid '+p.color+';">'
      +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">'
      +'<div style="font-weight:800;font-size:15px;color:var(--text);">'+c.name+'</div>'
      +(c.suspended?'<span class="badge badge-none">🚫 Suspended</span>':badgeHtml(c.expiry))+'</div>'
      +'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;">'+planBadge(c.plan)+'</div>'
      +'<div style="font-size:12px;color:var(--muted);margin-bottom:10px;">'
      +(c.expiry?(expired?'❌ Expired: ':'📅 Till: ')+fmtDate(c.expiry):'📅 No plan')+'</div>'
      +'<div class="pw-box"><div><div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;">🔑 Firebase Password</div>'
      +'<div id="pw-'+c.id+'" style="font-size:16px;font-weight:800;color:var(--green);letter-spacing:2px;font-family:monospace;">...</div></div>'
      +'<button class="btn btn-outline" style="font-size:11px;padding:5px 10px;" onclick="openChangePw(\''+c.id+'\')">✏️</button></div>'
      +'<div class="client-actions">'
      +'<button class="btn btn-outline" style="font-size:12px;padding:7px 11px;" onclick="copyLink(\''+c.id+'\')">🔗 Link</button>'
      +'<button class="btn '+(expired?'btn-red':'btn-green')+'" style="font-size:12px;padding:7px 11px;" onclick="openPayment(\''+c.id+'\')">💳 '+(expired?'Renew':'Pay')+'</button>'
      +'<button class="btn btn-outline" style="font-size:12px;padding:7px 11px;" onclick="showHistory(\''+c.id+'\')">📋</button>'
      +'<button class="btn btn-red" style="font-size:12px;padding:7px 11px;" onclick="deleteClient(\''+c.id+'\',' +'\''+nm+'\')">🗑️</button>'
      +'</div></div>';
  });
  list.innerHTML=html;
  filtered.forEach(function(c){fetchPw(c.id);});
}

/* Password */
function fetchPw(id){
  var c=clients.find(function(x){return x.id===id;});if(!c)return;
  var auth=c.apiKey?'?auth='+encodeURIComponent(c.apiKey):'';
  var el=document.getElementById('pw-'+id);if(!el)return;
  fetch(c.fbUrl+'/'+(c.node||'csc6')+'/Admin_Password.json'+auth)
    .then(function(r){return r.json();})
    .then(function(v){if(el){el.textContent=v?String(v):'(not set)';el.style.color=v?'var(--green)':'var(--muted)';}})
    .catch(function(){if(el){el.textContent='⚠️';el.style.color='var(--amber)';}});
}
var curPwId=null;
function openChangePw(id){
  curPwId=id;var c=clients.find(function(x){return x.id===id;});
  document.getElementById('cpw-client-name').textContent=c?c.name:'';
  document.getElementById('cpw-input').value='';document.getElementById('cpw-err').style.display='none';
  document.getElementById('cpw-btn').textContent='💾 Save';document.getElementById('cpw-btn').disabled=false;
  var pw=document.getElementById('pw-'+id);document.getElementById('cpw-current').textContent=pw?pw.textContent:'---';
  openModal('modal-cpw');setTimeout(function(){document.getElementById('cpw-input').focus();},200);
}
function doChangePw(){
  var c=clients.find(function(x){return x.id===curPwId;});if(!c)return;
  var np=document.getElementById('cpw-input').value.trim();
  var err=document.getElementById('cpw-err');var btn=document.getElementById('cpw-btn');
  if(!np){err.textContent='Password daalo!';err.style.display='block';return;}
  btn.disabled=true;btn.textContent='Saving...';err.style.display='none';
  var auth=c.apiKey?'?auth='+encodeURIComponent(c.apiKey):'';
  fetch(c.fbUrl+'/'+(c.node||'csc6')+'/Admin_Password.json'+auth,{
    method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(np)
  }).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
  .then(function(){showToast('✅ Password updated!');closeModal('modal-cpw');setTimeout(function(){fetchPw(curPwId);},300);})
  .catch(function(e){btn.disabled=false;btn.textContent='💾 Save';err.textContent='Error: '+e.message;err.style.display='block';});
}

/* Add Client */
function selectPlan(btn){
  curPlan=btn.dataset.plan;
  document.querySelectorAll('.plan-btn').forEach(function(b){
    var bp=PLANS[b.dataset.plan];var sel=b.dataset.plan===curPlan;
    b.style.background=sel?bp.color+'30':'rgba(0,0,0,0)';b.style.borderWidth=sel?'2.5px':'2px';
  });
}
function openAddClient(){
  ['a-name','a-url','a-pid'].forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('a-key').value='';document.getElementById('a-node').value='csc6';
  curPlan='basic';selectPlan(document.querySelector('.plan-btn[data-plan="basic"]'));
  openModal('modal-add');
}
function saveClient(){
  var name=document.getElementById('a-name').value.trim();
  var url=document.getElementById('a-url').value.trim().replace(/\/+$/,'');
  var key=document.getElementById('a-key').value.trim();
  var pid=document.getElementById('a-pid').value.trim();
  var node=document.getElementById('a-node').value.trim()||'csc6';
  if(!name||!url){showToast('Name aur Firebase URL zaroori hai!');return;}
  var c={id:'c_'+Date.now(),name:name,fbUrl:url,apiKey:key,pid:pid,node:node,
    plan:curPlan,expiry:null,payments:[],createdAt:new Date().toISOString()};
  clients.unshift(c);saveAll();renderAll();closeModal('modal-add');showToast('✅ Client added: '+name);
}

/* Payment */
function selectMonths(btn){
  curMonths=parseInt(btn.dataset.months);
  document.querySelectorAll('.month-btn').forEach(function(b){var sel=parseInt(b.dataset.months)===curMonths;b.style.background=sel?'var(--accent)':'transparent';b.style.color=sel?'#fff':'var(--accent)';});
  updatePayPreview();
}
function updatePayPreview(){
  if(!curPayClient)return;
  var p=PLANS[curPayClient.plan]||PLANS.basic;
  document.querySelectorAll('.month-price').forEach(function(el,i){el.textContent='₹'+(p.price*(i+1)).toLocaleString('en-IN');});
  var base=curPayClient.expiry&&new Date(curPayClient.expiry)>new Date()?new Date(curPayClient.expiry):new Date();
  var nd=new Date(base);nd.setMonth(nd.getMonth()+curMonths);
  document.getElementById('pay-new-expiry').textContent=fmtDate(nd.toISOString());
}
function openPayment(id){
  curPayClient=clients.find(function(c){return c.id===id;});if(!curPayClient)return;
  curMonths=1;document.getElementById('pay-client-name').textContent=curPayClient.name;
  document.getElementById('pay-status-badge').innerHTML=badgeHtml(curPayClient.expiry);
  document.getElementById('pay-current-expiry').textContent=curPayClient.expiry?'Till: '+fmtDate(curPayClient.expiry):'No active plan';
  document.getElementById('pay-note').value='';
  document.querySelectorAll('.month-btn').forEach(function(b,i){b.style.background=i===0?'var(--accent)':'transparent';b.style.color=i===0?'#fff':'var(--accent)';});
  updatePayPreview();openModal('modal-pay');
}
function confirmPayment(){
  if(!curPayClient)return;
  var p=PLANS[curPayClient.plan]||PLANS.basic;
  var base=curPayClient.expiry&&new Date(curPayClient.expiry)>new Date()?new Date(curPayClient.expiry):new Date();
  var nd=new Date(base);nd.setMonth(nd.getMonth()+curMonths);
  var pay={date:new Date().toISOString(),months:curMonths,amount:p.price*curMonths,note:document.getElementById('pay-note').value.trim(),newExpiry:nd.toISOString()};
  curPayClient.expiry=nd.toISOString();curPayClient.payments=(curPayClient.payments||[]).concat([pay]);
  saveAll();renderAll();closeModal('modal-pay');showToast('✅ Payment recorded! Expiry: '+fmtDate(nd.toISOString()));
}

/* History + Delete + Link */
function showHistory(id){
  var c=clients.find(function(x){return x.id===id;});if(!c)return;
  var h=(c.payments||[]).slice().reverse().map(function(p){return fmtDate(p.date)+' — ₹'+p.amount.toLocaleString('en-IN')+' ('+p.months+' mo)'+(p.note?' ['+p.note+']':'');}).join('\n')||'No payment history';
  alert('Payment History — '+c.name+'\n\n'+h);
}
function deleteClient(id,name){
  if(!confirm("'"+name+"' delete karo?"))return;
  clients=clients.filter(function(c){return c.id!==id;});
  saveAll();renderAll();showToast('Deleted: '+name);
}
function copyLink(id){
  var c=clients.find(function(x){return x.id===id;});if(!c)return;
  var link=BASE_URL+'#'+encodeLink(c,false);
  if(navigator.clipboard)navigator.clipboard.writeText(link).catch(function(){});
  showToast('📋 Client link copied!');
}
</script>
